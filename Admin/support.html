<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a></div></header><main class="wrap"><div id="api"></div><div id="list"></div></main><script src="admin.js"></script><script>api('/api/admin/support').then(d=>list.innerHTML=d.messages.map(x=>`<div class="panel"><b>${esc(x.subject)}</b><div class="muted">${esc(x.name)} · ${esc(x.email)} · ${esc(x.created_at)}</div><p>${esc(x.message)}</p></div>`).join('')||'<div class="panel">No support messages.</div>')</script></body></html>
