<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="users.html">Users</a><a href="tickets.html">Tickets</a></div></header><main class="wrap"><div id="api"></div><div class="panel"><a class="btn" href="orders.html">All orders</a> <a class="btn" href="orders.html?status=paid">Paid orders</a></div><div id="list"></div></main><script src="admin.js"></script><script>api('/api/admin/orders'+location.search).then(d=>list.innerHTML=d.orders.map(o=>`<div class="item"><div><b>${esc(o.eventTitle)}</b><div>${esc(o.userEmail)}</div><div>${esc(o.status)} · ${esc(o.reference)}</div></div><strong>${money(o.amount,o.currency)}</strong></div>`).join('')||'<div class="panel">No orders.</div>').catch(e=>list.textContent=e.message)</script></body></html>
