<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="events.html">Events</a><a href="giveaways.html">Giveaways</a></div></header><main class="wrap"><div id="api"></div><div class="panel"><h1>Create Event</h1><form id="f"><div class="row"><input name="title" placeholder="Event title" required><input name="artist" placeholder="Artist"></div><div class="row"><input name="date" type="date" required><input name="time" type="time" required></div><div class="row"><input name="venueName" placeholder="Venue" required><input name="city" placeholder="City" required></div><div class="row"><input name="country" placeholder="Country" required><input name="address" placeholder="Address"></div><div class="row"><input name="currency" value="NGN" placeholder="Currency"><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><textarea name="description" placeholder="Event description"></textarea><h2>Ticket inventory</h2><p class="muted">Add sections, rows, seats and prices. This is separate from giveaway management.</p><div id="rows"></div><button type="button" class="btn" onclick="addRow()">+ Add section / row / seat</button><button class="btn primary" style="display:block;margin-top:15px">Create event</button></form><p id="m"></p></div></main><script src="admin.js"></script><script>let rows=[];function addRow(){rows.push({section:'',row:'',seat:'',price:'',label:''});render()}function render(){rowsBox.innerHTML=rows.map((x,i)=>`<div class="item"><div class="row" style="width:100%"><input placeholder="Section" value="${esc(x.section)}" oninput="rows[${i}].section=this.value"><input placeholder="Row" value="${esc(x.row)}" oninput="rows[${i}].row=this.value"><input placeholder="Seat" value="${esc(x.seat)}" oninput="rows[${i}].seat=this.value"><input placeholder="Price" type="number" value="${esc(x.price)}" oninput="rows[${i}].price=this.value"><input placeholder="Label (optional)" value="${esc(x.label)}" oninput="rows[${i}].label=this.value"><button type="button" class="btn danger" onclick="rows.splice(${i},1);render()">Remove</button></div></div>`).join('')}const rowsBox=document.getElementById('rows');addRow();f.onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(f);fd.set('seats',JSON.stringify(rows));const d=await api('/api/admin/events',{method:'POST',body:fd});m.textContent=`Event created. ${d.ticketsCreated} tickets added.`;f.reset();rows=[];addRow()}catch(e){m.textContent=e.message}}</script></body></html>
