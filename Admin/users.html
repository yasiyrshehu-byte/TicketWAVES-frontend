<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="suspended.html">Suspended</a><a href="orders.html">Orders</a><a href="tickets.html">Tickets</a></div></header><main class="wrap"><div id="api"></div><div id="list"></div></main><script src="admin.js"></script><script>async function load(){const d=await api('/api/admin/users');list.innerHTML=d.users.map(u=>`<div class="item"><div><b>${esc(u.first_name)} ${esc(u.last_name)}</b><div>${esc(u.email)}</div><div class="muted">${u.suspended?'SUSPENDED':'Active'} · ${esc(u.created_at)}</div></div><div><button class="btn" onclick="toggle(${u.id},${u.suspended?0:1})">${u.suspended?'Unsuspend':'Suspend'}</button><button class="btn danger" onclick="del(${u.id})">Delete</button></div></div>`).join('')||'<div class="panel">No users.</div>'}async function toggle(id,v){await api('/api/admin/users/'+id+'/suspend',{method:'PATCH',body:JSON.stringify({suspended:v})});load()}async function del(id){if(confirm('Delete user account? Historical ticket/order records will be protected where possible.')){try{await api('/api/admin/users/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}load()</script></body></html>
