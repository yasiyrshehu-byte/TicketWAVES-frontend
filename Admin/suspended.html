<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suspended Users</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="users.html">All Users</a></div></header><main class="wrap"><div id="api"></div><div id="list"></div></main><script src="admin.js"></script><script>api('/api/admin/users').then(d=>{const a=d.users.filter(x=>x.suspended);list.innerHTML=a.map(u=>`<div class="item"><div><b>${esc(u.first_name)} ${esc(u.last_name)}</b><div>${esc(u.email)}</div></div><button class="btn" onclick="api('/api/admin/users/${u.id}/suspend',{method:'PATCH',body:JSON.stringify({suspended:false})}).then(()=>location.reload())">Unsuspend</button></div>`).join('')||'<div class="panel">No suspended users.</div>'}).catch(e=>list.textContent=e.message)</script></body></html>
