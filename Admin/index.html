<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="create-event.html">Create Event</a><a href="events.html">Events</a><a href="giveaways.html">Giveaways</a><a href="users.html">Users</a><a href="tickets.html">Tickets</a><a href="orders.html">Orders</a><a href="support.html">Support</a><button onclick="logout()">Logout</button></div></header><main class="wrap"><div id="api"></div><h1>Overview</h1><div id="stats" class="stats"></div><div class="panel"><h2>Quick links</h2><p><a href="create-event.html">Create a new event with a gallery image + sections/rows/seats</a></p><p><a href="giveaways.html">Create giveaway information or issue a free ticket directly to an existing account</a></p></div></main><script src="admin.js"></script><script>function logout(){localStorage.removeItem('tw_token');location.href='../login.html'}async function load(){try{const d=await api('/api/admin/stats');const map={users:'users.html',suspendedUsers:'suspended.html',events:'events.html',tickets:'tickets.html',availableTickets:'tickets.html?available=1',orders:'orders.html',paidOrders:'orders.html?status=paid',revenue:'orders.html?status=paid',giveaways:'giveaways.html'};stats.innerHTML=Object.entries(d.stats).map(([k,v])=>`<a class="stat" href="${map[k]||'#'}"><b>${esc(k)}</b><h2>${k==='revenue'?money(v):esc(v)}</h2></a>`).join('')}catch(e){stats.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}load()</script></body></html>
