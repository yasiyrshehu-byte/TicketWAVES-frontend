<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="events.html">Events</a><a href="users.html">Users</a><a href="orders.html">Orders</a></div></header><main class="wrap"><div id="api"></div><div class="panel"><a class="btn" href="tickets.html?available=1">Available tickets</a> <a class="btn" href="tickets.html">All tickets</a></div><div id="list"></div></main><script src="admin.js"></script><script>async function load(){try{const d=await api('/api/admin/tickets'+(location.search));list.innerHTML=d.tickets.map(t=>`<div class="item"><div><b>${esc(t.event_title)}</b><div class="muted">${esc(t.userEmail||'Unassigned')} · ${esc(t.event_date)} ${esc(t.event_time||'')}</div><div>Section ${esc(t.section)} · Row ${esc(t.row_name)} · Seat ${esc(t.seat)} · ${esc(t.status)} · ${esc(t.label||'')}</div><div>${esc(t.ticket_number)}</div></div><div><button class="btn" onclick="edit(${t.id})">Edit</button><button class="btn danger" onclick="del(${t.id})">Delete</button></div></div>`).join('')||'<div class="panel">No tickets.</div>'}catch(e){list.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}async function edit(id){const eventTitle=prompt('Event title'),eventDate=prompt('Event date'),eventTime=prompt('Event time'),venue=prompt('Venue'),section=prompt('Section'),row=prompt('Row'),seat=prompt('Seat'),label=prompt('Ticket label');try{await api('/api/admin/tickets/'+id,{method:'PATCH',body:JSON.stringify({eventTitle,eventDate,eventTime,venue,section,row,seat,label})});load()}catch(e){alert(e.message)}}async function del(id){if(confirm('Delete this ticket?')){try{await api('/api/admin/tickets/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}load()</script></body></html>
