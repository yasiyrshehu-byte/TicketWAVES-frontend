<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events Admin</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="nav"><div class="logo">TICKETWAVES ADMIN</div><a href="index.html">Dashboard</a><a href="create-event.html">Create Event</a><a href="giveaways.html">Giveaways</a><a href="tickets.html">Tickets</a></div></header><main class="wrap"><div id="api"></div><div id="list"></div></main><script src="admin.js"></script><script>async function load(){try{const d=await api('/api/admin/events');list.innerHTML=d.events.map(e=>`<div class="panel"><div class="row"><div><h2>${esc(e.title)}</h2><div class="muted">${esc(e.artist)} · ${esc(e.date)} ${esc(e.time)} · ${esc(e.venue)}, ${esc(e.city)}</div><div>Seats: ${e.seatCount} · Available: ${e.availableSeats}</div></div><img src="${base()+esc(e.image||'')}" style="width:180px;height:110px;object-fit:cover;border-radius:14px"></div><button class="btn" onclick="edit(${e.id})">Manage sections / rows / seats</button> <button class="btn danger" onclick="removeEvent(${e.id})">Delete event</button><div id="seat${e.id}"></div></div>`).join('')||'<div class="panel">No events.</div>'}catch(e){list.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}async function edit(id){const box=document.getElementById('seat'+id);const d=await api('/api/admin/event-seats/'+id);box.innerHTML=`<h3>Ticket inventory</h3>${d.seats.map(s=>`<div class="item"><div class="row"><input id="sec${s.id}" value="${esc(s.section)}"><input id="row${s.id}" value="${esc(s.row_name)}"><input id="seat${s.id}" value="${esc(s.seat)}"><input id="price${s.id}" value="${s.price}"><input id="label${s.id}" value="${esc(s.label||'')}"></div><button class="btn primary" onclick="saveSeat(${s.id})">Save</button><button class="btn danger" onclick="delSeat(${s.id})">Delete</button></div>`).join('')}<div class="panel"><h4>Add section / row / seat</h4><div class="row"><input id="newsec${id}" placeholder="Section"><input id="newrow${id}" placeholder="Row"><input id="newseat${id}" placeholder="Seat"><input id="newprice${id}" placeholder="Price"><input id="newlabel${id}" placeholder="Label"></div><button class="btn primary" onclick="addSeat(${id})">Add ticket</button></div>`}async function saveSeat(id){await api('/api/admin/event-seats/'+id,{method:'PATCH',body:JSON.stringify({section:document.getElementById('sec'+id).value,row:document.getElementById('row'+id).value,seat:document.getElementById('seat'+id).value,price:document.getElementById('price'+id).value,label:document.getElementById('label'+id).value})});alert('Saved');load()}async function delSeat(id){if(confirm('Delete this ticket seat?')){try{await api('/api/admin/event-seats/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}async function addSeat(e){const body={eventId:e,section:document.getElementById('newsec'+e).value,row:document.getElementById('newrow'+e).value,seat:document.getElementById('newseat'+e).value,price:document.getElementById('newprice'+e).value,label:document.getElementById('newlabel'+e).value};try{await api('/api/admin/event-seats',{method:'POST',body:JSON.stringify(body)});edit(e)}catch(x){alert(x.message)}}async function removeEvent(id){if(confirm('Delete event?')){try{await api('/api/admin/events/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}}load()</script></body></html>
