<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><div id="nav"></div><main class="wrap section"><h1>Users</h1><div id="out" class="tablewrap">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
nav.innerHTML=`<header class="adminnav"><div class="wrap"><div class="adminlinks"><a href="/admin/index.html">Overview</a><a class="active" href="/admin/users.html">Users</a><a href="/admin/suspended.html">Suspended</a><a href="/admin/events.html">Events</a><a href="/admin/tickets.html">Tickets</a><a href="/admin/orders.html">Orders</a><a href="/admin/revenue.html">Revenue</a><a href="/admin/giveaways.html">Giveaways</a><a href="/admin/create-event.html">Create Event</a><a href="/admin/create-giveaway.html">Create Giveaway</a></div></div></header>`;
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/users");out.innerHTML=`<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${d.users.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.email)}</td><td>${x.role}</td><td>${x.suspended?"Suspended":"Active"}</td><td>${x.role==="admin"?"":`<button class="secondary" onclick="toggle('${x._id}',${x.suspended})">${x.suspended?"Unsuspend":"Suspend"}</button>`}</td></tr>`).join("")}</tbody></table>`})();async function toggle(id,s){try{await TW.request("/admin/users/"+id+"/"+(s?"unsuspend":"suspend"),{method:"PATCH"});location.reload()}catch(e){alert(e.message)}}
</script></body></html>
