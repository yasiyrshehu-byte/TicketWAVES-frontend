<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap section"><div class="panel" style="max-width:480px;margin:70px auto"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><h1>Welcome back.</h1><form id="f" class="form"><input class="field" name="email" type="email" placeholder="Email" required><input class="field" name="password" type="password" placeholder="Password" required><button class="primary">Sign in</button></form><p id="m"></p><p>New here? <a style="color:var(--blue)" href="register.html">Create an account</a></p></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});localStorage.tw_token=r.token;localStorage.tw_user=JSON.stringify(r.user);const n=new URLSearchParams(location.search).get('next');location.href=n||'index.html'}catch(e){m.textContent=e.message}}</script></body></html>
