<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><header class="topbar"><div class="wrap nav"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><nav class="navlinks"><a href="/index.html">Discover</a><a href="/pages/for-you.html">For You</a><a href="/pages/my-tickets.html">My Tickets</a><a href="/pages/sell.html">Sell</a><a class="active" href="/pages/account.html">Account</a></nav></div></header><main class="wrap section"><div id="out" class="empty">Loading account…</div></main><nav class="bottomnav"><a href="/index.html">⌕<span>Discover</span></a><a href="/pages/for-you.html">♥<span>For You</span></a><a href="/pages/my-tickets.html">🎟<span>My Tickets</span></a><a href="/pages/sell.html">▣<span>Sell</span></a><a class="active" href="/pages/account.html">●<span>Account</span></a></nav><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{const u=await requireUser();if(!u)return;out.innerHTML=`<div class="accountHero"><div class="eyebrow">Account</div><h1>${escapeHtml(u.name)}</h1><p>${escapeHtml(u.email)}</p></div><section class="section"><div class="formcard"><h2>Notifications</h2><div class="accountrow"><span>My Notifications</span><span>✉</span></div><div class="accountrow"><span>Receive Notifications?</span><input id="notif" type="checkbox" ${u.notificationsEnabled?"checked":""}></div><h2 style="margin-top:28px">Location Settings</h2><div class="accountrow"><span>My Location</span><b>${escapeHtml(u.location||"Not set")}</b></div><div class="accountrow"><span>My Country</span><b>${escapeHtml(u.country||"Not set")}</b></div><h2 style="margin-top:28px">Preferences</h2><div class="accountrow"><a href="/pages/my-tickets.html">My Tickets</a><span>›</span></div><div class="accountrow"><a href="/pages/account-edit.html">Edit Details</a><span>›</span></div><div class="accountrow"><a href="/pages/orders.html">My Orders</a><span>›</span></div><div class="actions"><button class="secondary" data-logout>Logout</button></div></div></section>`;document.querySelector("[data-logout]").onclick=()=>{localStorage.removeItem("tw_token");location.href="/index.html"};notif.onchange=async()=>{await TW.request("/auth/me",{method:"GET"});await TW.request("/auth/me",{method:"PATCH",body:{notificationsEnabled:notif.checked}})}})();
</script></body></html>
