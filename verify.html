<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES Verification</title><style>body{font-family:Arial;background:#f4f5f7;margin:0;padding:24px;color:#10162b}.box{max-width:560px;margin:50px auto;background:white;border-radius:24px;padding:28px;box-shadow:0 10px 30px #0001}.ok{color:#16834b;font-weight:800}.row{padding:12px 0;border-bottom:1px solid #eee}small{color:#777}</style></head><body><div class="box" id="box"><h1>TicketWAVES</h1><p>Verifying ticket…</p></div><script src="./config.js"></script><script>const API=((window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api'),share=new URLSearchParams(location.search).get('share');async function run(){const b=document.getElementById('box');try{const r=await fetch(API+'/tickets/public/'+encodeURIComponent(share));const d=await r.json();if(!r.ok)throw Error(d.message||'Ticket not found');const e=d.eventId||{};b.innerHTML=`<h1>✓ Ticket verified</h1><p class="ok">VALID TICKET</p><div class="row"><small>Event</small><br><b>${e.title||'-'}</b></div><div class="row"><small>Artist</small><br>${e.artist||'-'}</div><div class="row"><small>Date & Time</small><br>${e.date||'-'} · ${e.time||'-'}</div><div class="row"><small>Venue</small><br>${e.venue||'-'}${e.city?', '+e.city:''}${e.country?', '+e.country:''}</div><div class="row"><small>Section / Row / Seat</small><br><b>${d.section||'-'} / ${d.row||'-'} / ${d.seat||'-'}</b></div><div class="row"><small>Ticket code</small><br>${d.ticketCode||'-'}</div>`}catch(e){b.innerHTML='<h1>Ticket verification</h1><p style="color:#b42318">This ticket could not be verified.</p><p>'+e.message+'</p>'}}run();</script></body></html>
