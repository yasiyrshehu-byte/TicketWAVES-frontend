<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Ticket Verification — TicketWAVES</title><style>body{margin:0;background:#f4f5f7;color:#11182b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:#090b10;color:#fff;padding:24px;font-weight:900}.wrap{max-width:600px;margin:35px auto;padding:18px}.box{background:#fff;border-radius:24px;border:1px solid #e1e4ea;padding:28px;box-shadow:0 12px 35px #11182b10;text-align:center}.ok{color:#118653;font-weight:900}.bad{color:#c92839;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ddd;border-bottom:1px solid #ddd;margin:22px 0}.grid div{padding:15px 5px}.grid small{display:block;color:#707887;font-weight:900;font-size:10px}.grid strong{font-size:20px}.spinner{display:inline-block;width:25px;height:25px;border:4px solid #dce2ee;border-right-color:#1765f5;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:500px){.grid strong{font-size:17px}}</style></head><body><div class="top">TicketWAVES · Ticket Verification</div><div class="wrap"><div class="box" id="box"><span class="spinner"></span><p>Verifying ticket…</p></div></div><script>const API='https://ticketwaves-backend-3.onrender.com/api';const c=document.getElementById('box');const code=new URLSearchParams(location.search).get('code');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function run(){try{const r=await fetch(API+'/verify/'+encodeURIComponent(code||''));const d=await r.json();if(!r.ok||!d.valid)throw Error(d.message||'Ticket is not valid');const e=d.event||{};c.innerHTML='<div class="ok">✓ VERIFIED TICKET</div><h1>'+esc(e.title||'Event')+'</h1><p>'+esc(e.artist||'')+' · '+esc(e.date||'')+' · '+esc(e.time||'')+'</p><p>'+esc(e.venue||'')+', '+esc(e.city||'')+'</p><div class="grid"><div><small>SECTION</small><strong>'+esc(d.section||'-')+'</strong></div><div><small>ROW</small><strong>'+esc(d.row||'-')+'</strong></div><div><small>SEAT</small><strong>'+esc(d.seat||'-')+'</strong></div></div><p>Ticket code: <b>'+esc(d.ticketCode)+'</b></p><p class="ok">Status: '+esc(d.status)+'</p>'}catch(e){c.innerHTML='<div class="bad">✕ TICKET NOT VERIFIED</div><h2>'+esc(e.message)+'</h2><p>Please contact TicketWAVES support if you believe this is an error.</p>'}}run();</script></body></html>
