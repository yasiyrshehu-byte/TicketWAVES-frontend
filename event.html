<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><div class="links"><a href="events.html">Events</a><a data-auth href="tickets.html">My Tickets</a><a data-guest href="login.html">Login</a></div></nav></header><main class="wrap section"><div id="event"></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id');let selected=[];api('/api/events/'+id).then(d=>{const e=d.event;event.innerHTML=`<div class="layout"><div class="panel"><img class="event-img" style="height:420px;border-radius:18px" src="${img(e.image)}"><div class="eyebrow" style="margin-top:20px">${esc(e.artist||'Live Event')}</div><h1>${esc(e.title)}</h1><div class="meta"><span>📅 ${esc(e.date)} · ${esc(e.time)}</span><span>📍 ${esc(e.venue)}, ${esc(e.city)}, ${esc(e.country)}</span></div><p style="color:var(--muted);line-height:1.7">${esc(e.description||'Experience the event live. Choose your seats below.')}</p></div><div class="panel"><h2>Select tickets</h2><div id="sections"></div><div id="seatBox"></div><div id="sum" class="price">0 selected</div><button id="buy" class="primary" style="width:100%;margin-top:15px">Continue to checkout</button></div></div>`;sections.innerHTML=d.sections.map(s=>`<button class="secondary" style="margin:4px" onclick="loadSeats('${esc(s.section)}')">Section ${esc(s.section)} · ${money(s.minPrice,s.currency)}</button>`).join('');buy.onclick=()=>{if(!requireLogin())return;if(!selected.length)return alert('Select at least one seat.');sessionStorage.setItem('tw_checkout',JSON.stringify({eventId:Number(id),seatIds:selected}));location.href='checkout.html'};}).catch(e=>event.innerHTML='<div class="empty">'+esc(e.message)+'</div>');function loadSeats(sec){api('/api/events/'+id+'/seats?section='+encodeURIComponent(sec)).then(d=>{seatBox.innerHTML='<div class="seats">'+d.seats.map(s=>`<button class="seat" data-id="${s.id}" data-price="${s.price}" onclick="pick(this)">${esc(s.section)}<br>Row ${esc(s.row_name)}<br>Seat ${esc(s.seat)}<br>${money(s.price,s.currency)}</button>`).join('')+'</div>'})}function pick(b){const id=Number(b.dataset.id);if(selected.includes(id)){selected=selected.filter(x=>x!==id);b.classList.remove('active')}else{selected.push(id);b.classList.add('active')}sum.textContent=selected.length+' ticket(s) selected';}</script></body></html>
