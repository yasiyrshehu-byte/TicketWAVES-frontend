<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Ticket</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="header"></div><main class="container"><form class="form-card" id="ticketEditForm"><h1>Edit ticket</h1><p class="muted">You can change the label, section, row, seat, price and status. This supports adding section/row information to an existing ticket label without recreating the whole event.</p><div class="form-group"><label>Event ID</label><input name="eventId" required></div><div class="form-group"><label>Ticket ID</label><input name="ticketId" required></div><div class="form-group"><label>Ticket label</label><input name="label"></div><div class="form-group"><label>Section</label><input name="section"></div><div class="form-group"><label>Row</label><input name="row"></div><div class="form-group"><label>Seat</label><input name="seat"></div><div class="form-group"><label>Price</label><input name="price" type="number" step="0.01"></div><div class="form-group"><label>Status</label><select name="status"><option>available</option><option>held</option><option>reserved</option><option>sold</option></select></div><button class="btn">Save ticket</button></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('#ticketEditForm');const q=new URLSearchParams(location.search);if(q.get('eventId'))f.eventId.value=q.get('eventId');if(q.get('ticketId'))f.ticketId.value=q.get('ticketId');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const eventId=d.eventId,ticketId=d.ticketId;delete d.eventId;delete d.ticketId;d.price=Number(d.price);try{await TW.api('/events/'+eventId+'/tickets/'+ticketId,{method:'PATCH',body:JSON.stringify(d)});alert('Ticket updated');location.href='/admin/tickets.html'}catch(x){alert(x.message)}}})</script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
