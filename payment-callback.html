<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — TicketWAVES</title></head><body style="font-family:Arial;text-align:center;padding:50px"><h1 id="h">Confirming payment…</h1><p id="p">Please wait.</p><script>
const API="https://ticketwaves-backend-3.onrender.com/api";const ref=new URLSearchParams(location.search).get("reference");const token=localStorage.getItem("ticketwaves_token");async function run(){if(!ref||!token){h.textContent="Payment received";p.textContent="Open TicketWAVES and check My Tickets.";return}try{const r=await fetch(API+"/payment/verify/"+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.message||"Verification failed");h.textContent="Payment successful 🎟️";p.textContent="Your ticket is now in My Tickets.";setTimeout(()=>location.href="./index.html",1800);}catch(e){h.textContent="Payment verification failed";p.textContent=e.message;}}run();
</script></body></html>
