<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-180.png"><title>TicketWAVES — Payment</title><style>body{margin:0;background:#f4f5f7;color:#11182b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(90%,540px);background:#fff;border-radius:24px;padding:32px;text-align:center;box-shadow:0 15px 45px #11182b14}.spinner{width:42px;height:42px;border:5px solid #1765f5;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;background:#1765f5;color:#fff;padding:14px 20px;font-weight:900}</style></head><body><div class="box"><div id="spin" class="spinner"></div><h1 id="title">Confirming payment…</h1><p id="m">Please wait while TicketWAVES verifies your Paystack payment. Your ticket is issued only after the payment is confirmed.</p></div><script>const API='https://ticketwaves-backend-3.onrender.com/api',p=new URLSearchParams(location.search),ref=p.get('reference')||p.get('trxref'),tk=localStorage.getItem('ticketwaves_token')||localStorage.getItem('token');async function verify(){if(!ref)throw Error('Payment reference is missing.');if(!tk)throw Error('Your sign-in session is missing. Please return to TicketWAVES and sign in to check My Tickets.');for(let i=0;i<5;i++){try{const r=await fetch(API+'/payment/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+tk},cache:'no-store'}),d=await r.json();if(r.ok&&d.status){document.getElementById('spin').style.display='none';document.getElementById('title').textContent='Payment confirmed ✓';document.getElementById('m').textContent='Your ticket has been added to My Tickets.';setTimeout(()=>location.replace('./index.html'),900);return}if(i===4)throw Error(d.message||'Payment is not confirmed yet.')}catch(e){if(i===4)throw e;await new Promise(r=>setTimeout(r,1800))}}}verify().catch(e=>{document.getElementById('spin').style.display='none';document.getElementById('title').textContent='Payment verification';document.getElementById('m').textContent=e.message;const b=document.createElement('button');b.textContent='Return to TicketWAVES';b.onclick=()=>location.replace('./index.html');document.getElementById('m').appendChild(document.createElement('br'));document.getElementById('m').appendChild(document.createElement('br'));document.getElementById('m').appendChild(b)});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
