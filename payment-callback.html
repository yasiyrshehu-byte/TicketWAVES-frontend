<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES Payment</title></head><body style="font-family:Arial;text-align:center;padding:50px"><h1>Confirming your payment…</h1><p id="m">Please wait. Do not close this page.</p><script>const API='https://ticketwaves-backend-3.onrender.com/api',ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref'),tk=localStorage.getItem('ticketwaves_token')||localStorage.getItem('token');fetch(API+'/payment/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+tk}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message);document.getElementById('m').textContent='Payment confirmed! Your ticket is now in My Tickets.';setTimeout(()=>location.replace('./index.html'),1200)}).catch(e=>{document.getElementById('m').textContent=e.message+' You can return to TicketWAVES and refresh My Tickets.'})</script></body></html>
