<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event for Sale · TicketWAVES</title><link rel="stylesheet" href="/css/style.css"><style>.ticket-row{border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0;background:#fff}.ticket-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.ticket-grid input{width:100%;box-sizing:border-box}.sale-actions{display:flex;gap:10px;flex-wrap:wrap}.loading{display:none;align-items:center;gap:10px}.loading.show{display:flex}.spinner{width:18px;height:18px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){.ticket-grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="header"></div><main class="container section"><div class="row between"><div><div class="eyebrow">ADMIN</div><h1>Create Event for Sale</h1><p class="muted">Create the event and its ticket inventory together so it is immediately available to Discover.</p></div><a class="btn ghost" href="/admin/index.html">Back</a></div><form id="saleForm" class="form-card"><div class="grid-2"><div class="form-group"><label>Event name *</label><input name="title" required></div><div class="form-group"><label>Artist name</label><input name="artist"></div><div class="form-group"><label>Category</label><input name="category" value="Concert"></div><div class="form-group"><label>Currency</label><select name="currency"><option>USD</option><option>CAD</option><option>GBP</option><option>EUR</option><option>NGN</option></select></div><div class="form-group"><label>Date *</label><input name="date" type="date" required></div><div class="form-group"><label>Time *</label><input name="time" type="time" required></div><div class="form-group"><label>Venue *</label><input name="venue" required></div><div class="form-group"><label>City</label><input name="city"></div><div class="form-group"><label>Country</label><input name="country"></div><div class="form-group"><label>Event image URL</label><input name="imageUrl" placeholder="https://..."></div></div><div class="form-group"><label>Event description</label><textarea name="description" rows="5"></textarea></div><hr><div class="row between"><div><h2>Tickets for sale</h2><p class="muted">Add as many section / row / seat / price combinations as needed.</p></div><button type="button" class="btn secondary" id="addTicket">+ Add ticket</button></div><div id="ticketRows"></div><div class="sale-actions"><button class="btn" id="submitBtn" type="submit">Create Event for Sale</button><a class="btn ghost" href="/admin/events.html">Cancel</a><div class="loading" id="loading"><span class="spinner"></span><span>Creating event and tickets…</span></div></div><div id="msg" class="muted" style="margin-top:12px"></div></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x)</script><script src="/js/app.js"></script><script src="/js/admin.js"></script><script src="/js/create-event-for-sale.js"></script></body></html>
