<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Event</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="header"></div><main class="container"><form class="form-card" id="eventForm"><h1>Edit Event</h1><div class="form-group"><label>Title</label><input name="title" required></div><div class="form-group"><label>Artist</label><input name="artist"></div><div class="form-group"><label>Category</label><input name="category"></div><div class="form-group"><label>Image URL</label><input name="imageUrl"></div><div class="form-group"><label>Venue</label><input name="venue" required></div><div class="form-group"><label>City</label><input name="city"></div><div class="form-group"><label>Country</label><input name="country"></div><div class="form-group"><label>Date</label><input name="date" type="date" required></div><div class="form-group"><label>Time</label><input name="time" type="time" required></div><div class="form-group"><label>Status</label><select name="status"><option>published</option><option>draft</option><option>cancelled</option></select></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Sections JSON</label><textarea name="sections"></textarea></div><div class="form-group"><label>Tickets JSON</label><textarea name="tickets"></textarea></div><div class="row"><button class="btn">Save changes</button><a class="btn ghost" href="/admin/events.html">Cancel</a></div></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x)</script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
