<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Giveaway — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:900px"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><div class="formcard" style="margin-top:22px"><h1>Create Giveaway</h1><p class="muted">This is separate from Create Event. Enter the event information yourself and issue the ticket directly to an existing account. Email delivery is not required.</p><div id="msg"></div><form id="f"><div class="formgrid"><div class="field full"><label>Recipient account email</label><input name="recipientEmail" type="email" required></div><div class="field"><label>Event title</label><input name="eventTitle" required></div><div class="field"><label>Artist</label><input name="artist"></div><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Time</label><input name="time" type="time"></div><div class="field"><label>Venue</label><input name="venue" required></div><div class="field"><label>City</label><input name="city"></div><div class="field"><label>Country</label><input name="country"></div><div class="field"><label>Price/value</label><input name="price" type="number" min="0" value="0"></div><div class="field"><label>Section</label><input name="section"></div><div class="field"><label>Row</label><input name="row"></div><div class="field"><label>Seat</label><input name="seat"></div><div class="field full"><label>Event/ticket information</label><textarea name="additionalInfo" placeholder="Add any information the recipient should see on the ticket."></textarea></div><div class="field full"><label>Event image from gallery</label><input name="image" type="file" accept="image/*" id="image"><img id="preview" style="display:none;max-width:280px;border-radius:18px"></div></div><div class="actions"><button class="primary">Issue Giveaway Ticket</button><a class="secondary" href="/admin/giveaways.html">Cancel</a></div></form></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return})();image.onchange=()=>{let f=image.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display="block"}};f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f);try{let d=await TW.request("/admin/giveaways",{method:"POST",body:fd});msg.innerHTML='<div class="notice success">Giveaway issued directly to the account. No email is required.</div>';setTimeout(()=>location.href="/admin/giveaways.html",900)}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
