<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Giveaway</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="header"></div><main class="container"><form class="form-card" id="giveawayForm"><h1>Add giveaway information</h1><div class="form-group"><label>Title</label><input name="title" required></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Prize</label><input name="prize" required></div><div class="form-group"><label>Event name</label><input name="eventName"></div><div class="form-group"><label>Image URL</label><input name="imageUrl"></div><div class="form-group"><label>Status</label><select name="status"><option>active</option><option>draft</option><option>ended</option></select></div><div class="form-group"><label>Start date/time</label><input name="startAt" type="datetime-local"></div><div class="form-group"><label>End date/time</label><input name="endAt" type="datetime-local"></div><button class="btn">Create giveaway</button></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x)</script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
