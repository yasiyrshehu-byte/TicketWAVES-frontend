<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="header"></div><main class="container"><form class="form-card" id="eventForm"><h1>Create Event</h1><p class="muted">Create an event and its ticket inventory. Sections/rows are stored separately from the ticket label so you can expand inventory later.</p><div class="form-group"><label>Title</label><input name="title" required></div><div class="form-group"><label>Artist</label><input name="artist"></div><div class="form-group"><label>Category</label><input name="category" value="Concert"></div><div class="form-group"><label>Image URL</label><input name="imageUrl" placeholder="https://..."></div><div class="form-group"><label>Venue</label><input name="venue" required></div><div class="form-group"><label>City</label><input name="city"></div><div class="form-group"><label>Country</label><input name="country"></div><div class="form-group"><label>Date</label><input name="date" type="date" required></div><div class="form-group"><label>Time</label><input name="time" type="time" required></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Sections JSON</label><textarea name="sections">[{"name":"A","rows":["1","2","3"],"capacity":30}]</textarea></div><div class="form-group"><label>Tickets JSON</label><textarea name="tickets">[]</textarea></div><p class="muted">For the simpler guided sale flow, use <a href="/admin/create-event-for-sale.html">Create Event for Sale</a>.</p><div class="row"><button class="btn">Create Event</button><a class="btn ghost" href="/admin/events.html">Cancel</a></div></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x)</script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
