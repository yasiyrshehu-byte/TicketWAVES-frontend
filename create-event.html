<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:900px"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><div class="formcard" style="margin-top:22px"><h1 id="heading">Create Event</h1><p class="muted">Add the event information and upload an image directly from your gallery.</p><div id="msg"></div><form id="f"><div class="formgrid"><div class="field"><label>Event title</label><input name="title" required></div><div class="field"><label>Artist</label><input name="artist"></div><div class="field"><label>Category</label><select name="category"><option>Concert</option><option>Sports</option><option>Theatre</option><option>Comedy</option><option>Festival</option><option>Conference</option></select></div><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Time</label><input name="time" type="time"></div><div class="field"><label>Venue</label><input name="venue" required></div><div class="field"><label>City</label><input name="city"></div><div class="field"><label>Country</label><input name="country"></div><div class="field full"><label>Description / additional information</label><textarea name="description"></textarea></div><div class="field full"><label>Event image from gallery</label><input name="image" type="file" accept="image/*" id="image"><img id="preview" style="display:none;max-width:260px;border-radius:18px"></div></div><div class="actions"><button class="primary">Save event</button><a class="secondary" href="/admin/events.html">Cancel</a></div></form></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;const id=new URLSearchParams(location.search).get("id");if(id){heading.textContent="Edit Event";let d=await TW.request("/events/"+id);let e=d.event;for(const [k,v] of Object.entries(e)){let el=f.elements[k];if(el&&k!=="date"&&k!=="image")el.value=v||""}f.elements.date.value=new Date(e.date).toISOString().slice(0,10)}})();
image.onchange=()=>{let file=image.files[0];if(file){preview.src=URL.createObjectURL(file);preview.style.display="block"}};
f.onsubmit=async e=>{e.preventDefault();let id=new URLSearchParams(location.search).get("id");let fd=new FormData(f);try{await TW.request(id?"/events/"+id:"/events",{method:id?"PATCH":"POST",body:fd});msg.innerHTML='<div class="notice success">Event saved successfully.</div>';setTimeout(()=>location.href="/admin/events.html",700)}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
