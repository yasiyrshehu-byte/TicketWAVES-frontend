<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><div class="links"><a href="tickets.html">My Tickets</a><a href="events.html">Events</a></div></nav></header><main class="wrap section"><div id="box"></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>let ticketData=null;if(requireLogin())api('/api/tickets/'+new URLSearchParams(location.search).get('id')).then(d=>{ticketData=d.ticket;const t=d.ticket;box.innerHTML=`<div class="ticket" style="max-width:760px;margin:auto"><img class="event-img" src="${img(t.eventImage)}"><div class="ticket-body"><span class="status">${esc(t.status)}</span><h1>${esc(t.eventTitle)}</h1><div class="meta" style="color:#d9def0;font-size:16px"><span>📅 ${esc(t.eventDate)} · ${esc(t.eventTime||'')}</span><span>📍 ${esc(t.eventVenue)}, ${esc(t.eventCity||'')}, ${esc(t.eventCountry||'')}</span><a class="secondary" style="display:inline-block;margin-top:8px" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((t.eventVenue||'')+', '+(t.eventCity||''))}">Directions / Map</a><span>🎟 Section ${esc(t.section||'—')} · Row ${esc(t.row||'—')} · Seat ${esc(t.seat||'—')}</span><span>Ticket number: ${esc(t.ticketNumber)}</span>${t.label?`<span>Label: ${esc(t.label)}</span>`:''}</div><div class="barcode"><img id="bar" alt="Ticket barcode"></div><div class="row" style="margin-top:18px"><a class="secondary" href="tickets.html">Back to My Tickets</a><button class="primary" onclick="transferTicket(${t.id})">Transfer</button></div><div class="row" style="margin-top:10px"><button class="secondary" disabled>Upgrade</button><button class="secondary" disabled>Sell</button></div></div></div>`}).then(async()=>{const r=await fetch(apiBase()+ticketData.barcodeUrl,{headers:{Authorization:'Bearer '+token()}});if(r.ok)bar.src=URL.createObjectURL(await r.blob())}).catch(e=>box.innerHTML='<div class="empty">'+esc(e.message)+'</div>');async function transferTicket(id){const email=prompt('Recipient TicketWAVES account email:');if(!email)return;try{const r=await api('/api/transfers',{method:'POST',body:JSON.stringify({ticketId:id,recipientEmail:email})});alert(r.message+(r.email?.sent?' Email notification sent.':''));location.reload()}catch(e){alert(e.message)}}</script></body></html>
