<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES Ticket</title>
<style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.wrap{max-width:720px;margin:auto}.hero{background:#202124;color:#fff}.hero img{width:100%;height:320px;object-fit:cover}.info{padding:24px}.info h1{font-size:36px;margin:10px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff}.tabs div{padding:20px;text-align:center;font-weight:900;border-bottom:4px solid #111}.section{background:#fff;padding:24px}.facts{display:grid;grid-template-columns:repeat(3,1fr);background:#eee}.fact{padding:15px}.fact small{display:block;color:#666;font-weight:800}.fact strong{font-size:23px}.qr{margin:22px auto;background:#fff;padding:18px;text-align:center}.qr img{width:min(300px,80vw)}.share{display:block;width:100%;border:0;background:#155eef;color:#fff;padding:16px;font-weight:900;font-size:17px}.back{display:inline-block;margin:15px;padding:10px 14px;background:#fff;border-radius:10px;text-decoration:none;color:#111}.err{padding:40px;text-align:center}@media(max-width:600px){.hero img{height:260px}.info h1{font-size:30px}.facts{grid-template-columns:1fr 1fr}.fact:last-child{grid-column:1/-1}}
</style></head><body><div class="wrap" id="app">Loading ticket…</div>
<script>
const API="https://ticketwaves-backend-3.onrender.com/api";const params=new URLSearchParams(location.search);const shareToken=params.get("share");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function go(){if(!shareToken){document.getElementById("app").innerHTML='<div class="err">No ticket link was supplied.</div>';return}try{const r=await fetch(API+"/tickets/public/"+encodeURIComponent(shareToken));const t=await r.json();if(!r.ok)throw new Error(t.message||"Ticket not found");const e=t.eventId||{};const url=location.href;document.getElementById("app").innerHTML=`<a class="back" href="./index.html">← TicketWAVES</a><div class="hero">${e.image?`<img src="${esc(e.image)}">`:""}<div class="info"><div>${esc((e.date||"").toUpperCase())} · ${esc(e.time||"")}</div><h1>${esc(e.title||"TicketWAVES Event")}</h1><div>${esc(e.venue||"")}${e.city?", "+esc(e.city):""}</div></div></div><div class="tabs"><div>Tickets</div><div style="border-bottom-color:#777">Extras</div></div><div class="section"><h2>Ticket</h2><div class="facts"><div class="fact"><small>SECTION</small><strong>${esc(t.section||"-")}</strong></div><div class="fact"><small>ROW</small><strong>${esc(t.row||"-")}</strong></div><div class="fact"><small>SEAT</small><strong>${esc(t.seat||"-")}</strong></div></div><div class="qr"><h3>SCAN TO ENTER</h3><img src="${esc(t.qrImage||"")}" alt="QR code"><div><b>${esc(t.ticketCode||"")}</b></div></div><button class="share" onclick="share()">Share Ticket Link ↗</button></div>`;}catch(e){document.getElementById("app").innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
async function share(){try{if(navigator.share)await navigator.share({title:"TicketWAVES Ticket",text:"View my TicketWAVES ticket",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Ticket link copied");}}catch(e){}}
go();
</script></body></html>
