<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES — Ticket</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:15px}.top a{color:#111;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto}.loading{padding:60px 20px;text-align:center}.ticket{background:#fff;margin:15px;border-radius:24px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}.eventImage{width:100%;height:270px;object-fit:cover;background:#151a36}.info{padding:22px}.date{font-size:13px;font-weight:900;color:#5d6473;letter-spacing:.5px;text-transform:uppercase}.title{font-size:31px;line-height:1.05;margin:9px 0}.venue{color:#606775}.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #eee}.tabs div{padding:17px;text-align:center;font-weight:900}.tabs .active{border-bottom:4px solid #111}.section{padding:20px}.facts{display:grid;grid-template-columns:repeat(3,1fr);background:#f0f1f4;border-radius:15px;overflow:hidden}.fact{padding:14px;border-right:1px solid #ddd}.fact:last-child{border:0}.fact small{display:block;color:#707681;font-size:11px;font-weight:900}.fact strong{display:block;font-size:20px;margin-top:5px}.qrbox{text-align:center;padding:25px 10px}.qrbox img{width:min(290px,78vw);height:auto;background:#fff;border-radius:8px}.qrstatus{font-size:12px;color:#69707d;margin-top:8px}.ticketId{text-align:center;font-weight:800;margin-top:10px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:20px}.actions button{border:0;border-radius:12px;padding:13px;font-weight:850}.blue{background:#155eef;color:#fff}.light{background:#eef1f5;color:#111}.social{margin:15px;background:#10152f;color:#fff;border-radius:18px;padding:22px}.social button{margin-top:10px;border:0;border-radius:10px;padding:12px 15px;font-weight:850}.error{padding:40px 20px;text-align:center;color:#b42318}.small{font-size:13px;color:#69707d}@media(max-width:600px){.eventImage{height:235px}.title{font-size:28px}.facts{grid-template-columns:1fr 1fr}.fact:last-child{grid-column:1/-1;border-top:1px solid #ddd}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><div class="top"><div class="wrap"><a href="index.html">← TICKETWAVES</a></div></div><main class="wrap" id="app"><div class="loading">Loading ticket…</div></main>
<script>
const API="https://ticketwaves-backend-3.onrender.com/api";const p=new URLSearchParams(location.search);const share=p.get("share");const id=p.get("ticket")||p.get("id");const token=localStorage.getItem("token")||localStorage.getItem("ticketwaves_token");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function getTicket(){let url;if(share)url=API+"/tickets/public/"+encodeURIComponent(share);else if(id&&token)url=API+"/tickets/"+encodeURIComponent(id);else{location.href="login.html";return;}const r=await fetch(url,{headers:token?{Authorization:`Bearer ${token}`}:{}});const d=await r.json();if(!r.ok)throw new Error(d.message||"Ticket not found");return d.ticket||d.data||d;}
function ticketView(t){const e=t.eventId||t.event||{};const title=t.eventTitle||e.title||"Event";const image=t.eventImage||e.image||"";const date=t.eventDate||e.date||"";const time=t.eventTime||e.time||"";const venue=[t.eventVenue||e.venue,t.eventCity||e.city,t.eventCountry||e.country].filter(Boolean).join(" · ");const code=t.ticketNumber||t.ticketCode||t.id||t._id||"";const qr=t.qrImage||t.qrCode||"";const shareUrl=share?location.href:`${location.origin}${location.pathname}?share=${encodeURIComponent(t.shareToken||"")}`;document.getElementById("app").innerHTML=`<article class="ticket">${image?`<img class="eventImage" src="${esc(image)}" onerror="this.style.display='none'">`:``}<div class="info"><div class="date">${esc(date)} · ${esc(time)}</div><h1 class="title">${esc(title)}</h1><div class="venue">${esc(venue)}</div></div><div class="tabs"><div class="active">Tickets</div><div>Extras</div></div><section class="section"><h2>Ticket</h2><div class="facts"><div class="fact"><small>SECTION</small><strong>${esc(t.section||"Not assigned")}</strong></div><div class="fact"><small>ROW</small><strong>${esc(t.row||"Not assigned")}</strong></div><div class="fact"><small>SEAT</small><strong>${esc(t.seat||"Not assigned")}</strong></div></div><div class="qrbox"><h3>Ticket QR Code</h3>${qr?`<img src="${esc(qr)}" alt="Ticket QR code">`:`<div class="loading">QR code unavailable</div>`}<div class="qrstatus">Scan this QR code to verify your ticket at the event.</div><div class="ticketId">Ticket ID #${esc(code)}</div></div><div class="small">Order #${esc(t.orderNumber||t.orderId||"—")} · ${esc(t.status||"Confirmed")}</div></section><div class="social"><b>YOU GOT TICKETS!</b><p>Post on social media and share that you got tickets with your friends and family.</p><button onclick="shareTicket('${encodeURIComponent(shareUrl)}')">Share You're Going</button></div><div class="actions"><button class="light" onclick="directions('${encodeURIComponent(venue)}')">Get Directions</button><button class="light" onclick="shareTicket('${encodeURIComponent(shareUrl)}')">Share Ticket</button>${id?`<button class="blue" onclick="location.href='transfer.html?ticket=${encodeURIComponent(id)}'">Transfer</button>`:""}<button class="light" onclick="print()">Print Ticket</button></div></article>`;}
async function shareTicket(encoded){const url=decodeURIComponent(encoded);try{if(navigator.share)await navigator.share({title:"TicketWAVES Ticket",text:"View this TicketWAVES ticket",url});else{await navigator.clipboard.writeText(url);alert("Ticket link copied!");}}catch(e){}}
function directions(encoded){const q=decodeURIComponent(encoded);if(q)location.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
getTicket().then(ticketView).catch(e=>document.getElementById("app").innerHTML=`<div class="error"><h2>Unable to load ticket</h2><p>${esc(e.message)}</p><a href="index.html">Back to TicketWAVES</a></div>`);
</script></body></html>
