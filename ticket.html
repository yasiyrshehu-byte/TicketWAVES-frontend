<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Ticket · TicketWAVES</title><link rel="stylesheet" href="/css/style.css"><style>@media print{.topbar,.no-print{display:none!important}.ticket{box-shadow:none}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">Ticket<span>WAVES</span></a><nav class="navlinks" id="navlinks"></nav></div></header><main class="container section"><div class="ticket"><div class="row between"><span class="badge green">You Got Tickets! 🎉</span><strong id="orderNumber"></strong></div><h1 id="ticketEvent"></h1><p class="muted" id="ticketMeta"></p><div id="ticketItems"></div><div class="row between" style="margin-top:16px"><strong>Total</strong><strong id="ticketTotal"></strong></div><div class="share" style="margin-top:16px;padding:16px;background:#f8fafc;border-radius:12px"><strong>Share your tickets</strong><p class="muted">Send the ticket page to your friends.</p><button class="btn secondary no-print" id="shareBtn">Share ticket</button></div></div><div class="row no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button><a class="btn secondary" href="/my-tickets.html">My Tickets</a></div></main><script src="/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#shareBtn').onclick=async()=>{const u=location.href;if(navigator.share)await navigator.share({title:'TicketWAVES Ticket',url:u});else{await navigator.clipboard.writeText(u);alert('Ticket link copied')}})</script></body></html>
