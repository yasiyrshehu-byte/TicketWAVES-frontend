<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><h1>My Orders</h1><div id="out" class="empty">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{if(!await requireUser())return;try{let d=await TW.request("/orders/mine");out.className="grid";out.innerHTML=d.orders.length?d.orders.map(o=>`<div class="card"><div class="cardbody"><span class="tag">${o.status}</span><div class="eventtitle">${escapeHtml(o.paymentReference)}</div><p>${o.tickets.length} ticket(s)</p><b>${formatMoney(o.amount,o.currency)}</b></div></div>`).join(""):`<div class="empty">No orders yet.</div>`}catch(e){out.innerHTML=e.message}})();
</script></body></html>
