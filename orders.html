<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><div class="links"><a href="tickets.html">My Tickets</a><a href="profile.html">Profile</a><a href="#" onclick="logout();return false">Logout</a></div></nav></header><main class="wrap section"><h1>My Orders</h1><div id="list" class="form"></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>if(requireLogin())api('/api/orders/me').then(d=>list.innerHTML=d.orders.map(o=>`<div class="panel"><div class="eyebrow">${esc(o.status)}</div><h2>${esc(o.eventTitle)}</h2><div class="meta"><span>${esc(o.date)} · ${esc(o.time)}</span><span>${esc(o.venue)}, ${esc(o.city)}</span><span>Reference: ${esc(o.reference)}</span><span>Total: ${money(o.amount,o.currency)}</span></div></div>`).join('')||'<div class="empty">No orders yet.</div>')</script></body></html>
