<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paid Orders — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><h1>Paid Orders</h1><div id="out" class="tablewrap">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/orders");let os=d.orders.filter(o=>o.status==="paid");out.innerHTML=os.length?`<table class="table"><tr><th>Order</th><th>User</th><th>Amount</th><th>Tickets</th><th>Paid</th></tr>${os.map(o=>`<tr><td>${escapeHtml(o.paymentReference)}</td><td>${escapeHtml(o.user?.email||"")}</td><td>${formatMoney(o.amount,o.currency)}</td><td>${o.tickets.length}</td><td>${o.paidAt?new Date(o.paidAt).toLocaleString():"-"}</td></tr>`).join("")}</table>`:'<div class="empty">No paid orders yet.</div>'})();
</script></body></html>
