<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#ffffff">

    <title>My Tickets | TicketWAVES</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./ticket.css">
</head>

<body>

<header class="nav">
    <a class="brand" href="./index.html">
        TICKET<span>WAVES</span>
    </a>

    <nav>
        <a href="./events.html">Events</a>
        <a class="active-nav" href="./my-tickets.html">My Tickets</a>
        <a href="./profile.html">Profile</a>
        <a id="authLink" href="./login.html">Login</a>
    </nav>
</header>


<main class="tickets-page">

    <div class="tickets-header">
        <h1>My Tickets</h1>

        <div class="ticket-tabs">
            <button class="ticket-tab active" data-tab="upcoming">
                UPCOMING <span id="upcomingCount">0</span>
            </button>

            <button class="ticket-tab" data-tab="past">
                PAST <span id="pastCount">0</span>
            </button>
        </div>
    </div>


    <section id="tickets" class="tickets-list">

        <div class="tickets-loading">
            <div class="loading-spinner"></div>
            <p>Loading your tickets…</p>
        </div>

    </section>

</main>


<footer>
    © 2026 TicketWAVES ·
    <a href="./support.html">Customer support</a>
</footer>


<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./tickets.js"></script>

</body>
</html>
