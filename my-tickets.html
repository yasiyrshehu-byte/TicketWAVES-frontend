<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Tickets · TicketWAVES</title><link rel="stylesheet" href="/css/style.css"><style>.ticket-card{overflow:hidden}.ticket-hero{width:100%;aspect-ratio:16/8;object-fit:cover}.ticket-info{padding:18px}.ticket-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-top:1px dashed #d0d5dd}.ticket-actions .btn{padding:10px 6px;font-size:12px}.share{padding:16px;background:#f8fafc;border-top:1px solid #eaecf0}.seat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.seat-grid div{padding:10px;background:#f2f4f7;border-radius:10px}.small{font-size:12px;color:#667085}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">Ticket<span>WAVES</span></a><nav class="navlinks" id="navlinks"></nav></div></header><main class="container section"><div class="section-head"><div><div class="eyebrow">Your tickets</div><h1>My Tickets</h1></div><a class="btn secondary" href="/events.html">Find events</a></div><div id="orders"></div></main><script src="/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const el=document.querySelector('#orders');if(!TW.session())return location.href='/login.html';try{const {orders}=await TW.api('/orders/mine');el.innerHTML=orders.length?orders.map(o=>{const e=o.event||{};const i=o.items?.[0]||{};return `<article class="card ticket-card" style="margin-bottom:18px"><img class="ticket-hero" src="${TW.escapeHtml(e.imageUrl||'https://placehold.co/1000x500?text=TicketWAVES')}" alt=""><div class="ticket-info"><div class="row between"><span class="badge green">You Got Tickets!</span><span class="small">${TW.escapeHtml(o.orderNumber)}</span></div><h2>${TW.escapeHtml(e.title||'Event')}</h2><strong>${TW.escapeHtml(e.date||'')} · ${TW.escapeHtml(e.time||'')}</strong><p class="muted">${TW.escapeHtml(e.venue||'')}, ${TW.escapeHtml(e.city||'')}</p><div class="seat-grid"><div><span class="small">Quantity</span><br><strong>${o.items.length}</strong></div><div><span class="small">Section</span><br><strong>${TW.escapeHtml(i.section||'-')}</strong></div><div><span class="small">Row / Seat</span><br><strong>${TW.escapeHtml(i.row||'-')} / ${TW.escapeHtml(i.seat||'-')}</strong></div></div><div class="row between"><span class="small">Order total</span><strong>${TW.money(o.total,o.currency)}</strong></div><p><a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((e.venue||'')+' '+(e.city||''))}" target="_blank" rel="noopener">Map / Directions</a></p></div><div class="share"><strong>You Got Tickets! 🎉</strong><p class="small">Share your event with friends.</p><button class="btn secondary" data-share="${o._id}">Share</button></div><div class="ticket-actions"><button class="btn ghost" data-action="upgrade">Upgrade</button><button class="btn ghost" data-action="transfer">Transfer</button><button class="btn ghost" data-action="sell">Sell</button></div><div style="padding:0 16px 16px"><a class="btn" style="width:100%;text-align:center" href="/ticket.html?id=${o._id}">Open ticket</a></div></article>`}).join(''):'<div class="empty">You have no orders yet.</div>';document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const text='I got tickets on TicketWAVES!';if(navigator.share)await navigator.share({text,url:location.origin+'/ticket.html?id='+b.dataset.share});else{await navigator.clipboard.writeText(location.origin+'/ticket.html?id='+b.dataset.share);alert('Ticket link copied')}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>alert(b.dataset.action==='transfer'?'Transfer workflow is ready for connection to your verified transfer provider.':b.dataset.action==='sell'?'Selling workflow is ready for connection to your marketplace rules.':'Upgrade options can be connected to an event upgrade inventory.'))}catch(e){el.innerHTML='<div class="alert">'+TW.escapeHtml(e.message)+'</div>'}})</script></body></html>
