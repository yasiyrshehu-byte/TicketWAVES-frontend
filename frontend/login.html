<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap" style="padding:70px 0;max-width:520px"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><section class="section"><div class="formcard"><h1>Welcome back</h1><p class="muted">Sign in to your TicketWAVES account.</p><div id="msg"></div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><div class="actions"><button class="primary">Sign in</button><a class="secondary" href="/pages/register.html">Create account</a></div></form></div></section></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
f.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";try{let d=await TW.request("/auth/login",{method:"POST",body:{email:email.value,password:password.value}});localStorage.setItem("tw_token",d.token);location.href=d.user.role==="admin"?"/admin/index.html":"/index.html"}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
