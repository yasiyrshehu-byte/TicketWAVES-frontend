<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><header class="topbar"><div class="wrap nav"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><a class="browse" href="/index.html">Discover</a></div></header><main class="wrap section"><div id="out" class="empty">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id"); const q=new URLSearchParams(location.search).get("q");
(async()=>{if(!id){let c=document.createElement("div");c.className="grid";document.querySelector("#out").replaceWith(c);loadEvents(c,q||"");return}
try{let d=await TW.request("/events/"+id),e=d.event;out.outerHTML=`<div><div class="card">${e.imageId?`<img class="eventimg" src="${imageUrl(e.imageId)}">`:""}<div class="cardbody"><span class="tag">${escapeHtml(e.category)}</span><h1>${escapeHtml(e.title)}</h1><p class="muted">${escapeHtml(e.artist||"")}</p><div class="meta"><span>📅 ${new Date(e.date).toLocaleDateString()} ${escapeHtml(e.time||"")}</span><span>📍 ${escapeHtml(e.venue)} · ${escapeHtml(e.city)} ${escapeHtml(e.country)}</span></div><p>${escapeHtml(e.description||"")}</p></div></div><section class="section"><div class="sectionhead"><h2>Tickets</h2></div><div class="grid">${d.tickets.length?d.tickets.map(t=>`<div class="card"><div class="cardbody"><span class="tag">Available</span><div class="eventtitle">${escapeHtml(t.section||"General")} · Row ${escapeHtml(t.row||"-")} · Seat ${escapeHtml(t.seat||"-")}</div><p class="muted">${escapeHtml(t.additionalInfo||"")}</p><div class="price">${formatMoney(t.price,t.currency)}</div><button class="primary" onclick="buy('${t._id}')">Buy ticket</button></div></div>`).join(""):`<div class="empty">No tickets available.</div>`}</div></section></div>`}catch(x){out.innerHTML=x.message}})();
async function buy(id){if(!TW.token()){location.href="/pages/login.html";return}try{let d=await TW.request("/orders",{method:"POST",body:{ticketId:id}});location.href="/pages/checkout.html?id="+d.order._id}catch(e){alert(e.message)}}
</script></body></html>
