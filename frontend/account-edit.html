<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Account — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:650px"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><div class="formcard" style="margin-top:25px"><h1>Edit Details</h1><div id="msg"></div><form id="f"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Country</label><input id="country"></div><div class="field"><label>Location</label><input id="location"></div><div class="actions"><button class="primary">Save changes</button><a class="secondary" href="/pages/account.html">Back</a></div></form></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
(async()=>{let u=await requireUser();if(!u)return;name.value=u.name;phone.value=u.phone||"";country.value=u.country||"";location.value=u.location||""})();f.onsubmit=async e=>{e.preventDefault();try{await TW.request("/auth/me",{method:"PATCH",body:{name:name.value,phone:phone.value,country:country.value,location:location.value}});msg.innerHTML='<div class="notice success">Saved.</div>'}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
