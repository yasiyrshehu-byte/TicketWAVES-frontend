<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Tickets — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><h1>Available Tickets</h1><div id="out" class="tablewrap">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/tickets");let ts=d.tickets.filter(t=>t.status==="available");out.innerHTML=ts.length?`<table class="table"><tr><th>Event</th><th>Section</th><th>Row</th><th>Seat</th><th>Price</th><th>Code</th></tr>${ts.map(t=>`<tr><td>${escapeHtml(t.event?.title||"")}</td><td>${escapeHtml(t.section)}</td><td>${escapeHtml(t.row)}</td><td>${escapeHtml(t.seat)}</td><td>${formatMoney(t.price,t.currency)}</td><td>${escapeHtml(t.ticketCode)}</td></tr>`).join("")}</table>`:'<div class="empty">No available tickets.</div>'})();
</script></body></html>
