<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suspended Users — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><h1>Suspended Users</h1><div id="out" class="tablewrap">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/users");let rows=d.users.filter(x=>x.suspended);out.innerHTML=rows.length?`<table class="table"><tr><th>Name</th><th>Email</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.email)}</td><td><button class="secondary" onclick="uns('${x._id}')">Unsuspend</button></td></tr>`).join("")}</table>`:'<div class="empty">No suspended users.</div>'})();async function uns(id){await TW.request("/admin/users/"+id+"/unsuspend",{method:"PATCH"});location.reload()}
</script></body></html>
