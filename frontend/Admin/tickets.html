<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><div class="sectionhead"><h1>All Tickets</h1><a class="primary" href="/admin/create-ticket.html">Add Ticket</a></div><div id="out" class="tablewrap">Loading…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/tickets");out.innerHTML=`<table class="table"><tr><th>Event</th><th>Section</th><th>Row</th><th>Seat</th><th>Price</th><th>Status</th><th>Owner</th><th>Action</th></tr>${d.tickets.map(t=>`<tr><td>${escapeHtml(t.event?.title||"")}</td><td>${escapeHtml(t.section)}</td><td>${escapeHtml(t.row)}</td><td>${escapeHtml(t.seat)}</td><td>${formatMoney(t.price,t.currency)}</td><td>${t.status}</td><td>${escapeHtml(t.owner?.email||"-")}</td><td><a class="secondary" href="/admin/create-ticket.html?id=${t._id}">Edit</a> <button class="secondary" onclick="del('${t._id}')">Delete</button></td></tr>`).join("")}</table>`})();async function del(id){if(confirm("Cancel/delete this ticket?")){await TW.request("/tickets/"+id,{method:"DELETE"});location.reload()}}
</script></body></html>
