<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giveaways — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><div class="sectionhead"><h1>Giveaways</h1><a class="primary" href="/admin/create-giveaway.html">Create Giveaway</a></div><div id="out" class="grid"></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/giveaways");out.innerHTML=d.giveaways.length?d.giveaways.map(g=>`<div class="card"><div class="cardbody"><span class="tag">${g.status}</span><div class="eventtitle">${escapeHtml(g.eventInfo?.title||g.event?.title||"Giveaway")}</div><p>Recipient: ${escapeHtml(g.recipient?.email||"")}</p><p>Ticket: ${escapeHtml(g.ticket?.ticketCode||"-")}</p></div></div>`).join(""):'<div class="empty">No giveaways yet.</div>'})();
</script></body></html>
