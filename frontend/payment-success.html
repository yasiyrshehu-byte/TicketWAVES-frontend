<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:680px"><div id="out" class="formcard">Verifying payment…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
(async()=>{try{let order=new URLSearchParams(location.search).get("order");let reference=new URLSearchParams(location.search).get("reference");await TW.request("/orders/"+order+"/paystack/verify?reference="+encodeURIComponent(reference||""),{method:"GET"});out.innerHTML='<div class="notice success">Payment verified. Your ticket has been issued and saved to your account.</div><div class="actions"><a class="primary" href="/pages/my-tickets.html">Open My Tickets</a></div>'}catch(e){out.innerHTML=`<div class="notice danger">${e.message}</div><div class="actions"><a class="secondary" href="/pages/orders.html">View Orders</a></div>`}})();
</script></body></html>
