<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:760px"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><div id="out" class="formcard" style="margin-top:25px">Loading order…</div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{try{if(!await requireUser())return;let d=await TW.request("/orders/mine");let id=new URLSearchParams(location.search).get("id");let o=d.orders.find(x=>x._id===id);if(!o)throw Error("Order not found");out.innerHTML=`<h1>Review your order</h1><p class="muted">${o.tickets.length} ticket(s)</p><h2>${formatMoney(o.amount,o.currency)}</h2><div class="actions"><button class="primary" onclick="pay('${o._id}')">${o.provider==="paystack"?"Pay securely":"Complete test purchase"}</button><a class="secondary" href="/index.html">Cancel</a></div><div class="notice">${o.provider==="paystack"?"You will be redirected to Paystack to complete payment securely.":"Test mode is enabled. Completing this purchase will create the ticket in MongoDB and place it in My Tickets."}</div>`}catch(e){out.innerHTML=`<div class="notice danger">${e.message}</div>`}})();
async function pay(id){try{let o=(await TW.request("/orders/mine")).orders.find(x=>x._id===id);if(o.provider==="paystack"){let d=await TW.request("/orders/"+id+"/paystack/initialize",{method:"POST"});location.href=d.authorization_url}else{await TW.request("/orders/"+id+"/pay",{method:"POST"});location.href="/pages/payment-success.html?order="+id}}catch(e){alert(e.message)}}
</script></body></html>
