<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tickets — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><header class="topbar"><div class="wrap nav"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><nav class="navlinks"><a href="/index.html">Discover</a><a href="/pages/for-you.html">For You</a><a class="active" href="/pages/my-tickets.html">My Tickets</a><a href="/pages/sell.html">Sell</a><a href="/pages/account.html">Account</a></nav></div></header><main class="wrap section"><div class="sectionhead"><h2>My Tickets</h2><a class="secondary" href="/index.html">Find events</a></div><div id="out"></div></main><nav class="bottomnav"><a href="/index.html">⌕<span>Discover</span></a><a href="/pages/for-you.html">♥<span>For You</span></a><a class="active" href="/pages/my-tickets.html">🎟<span>My Tickets</span></a><a href="/pages/sell.html">▣<span>Sell</span></a><a href="/pages/account.html">●<span>Account</span></a></nav><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{if(!await requireUser())return;try{let d=await TW.request("/tickets/mine");if(!d.tickets.length){out.innerHTML='<div class="empty">You don’t have tickets yet.</div>';return}out.innerHTML=d.tickets.map(t=>`<article class="ticket" style="margin-bottom:20px"><div class="tickettop"><div class="label" style="color:#b9c1dd">TicketWAVES</div><h2>${escapeHtml(t.event?.title||"Event")}</h2><p>${escapeHtml(t.event?.artist||"")}</p></div><div class="ticketbody"><div class="ticketgrid"><div><div class="label">Date</div><div class="value">${new Date(t.event?.date).toLocaleDateString()}</div></div><div><div class="label">Venue</div><div class="value">${escapeHtml(t.event?.venue||"")}</div></div><div><div class="label">Section</div><div class="value">${escapeHtml(t.section||"-")}</div></div><div><div class="label">Row</div><div class="value">${escapeHtml(t.row||"-")}</div></div><div><div class="label">Seat</div><div class="value">${escapeHtml(t.seat||"-")}</div></div><div><div class="label">Ticket code</div><div class="value">${escapeHtml(t.ticketCode)}</div></div></div><img class="barcode" src="${TW.base.replace(/\\/api$/,"")}/api/tickets/barcode/${t._id}" alt="Barcode"><div class="actions"><button class="secondary" onclick="transfer('${t._id}')">Transfer</button></div></div></article>`).join("")}catch(e){out.innerHTML=`<div class="empty">${e.message}</div>`}})();
async function transfer(id){const email=prompt("Recipient account email:");if(!email)return;try{await TW.request("/tickets/"+id+"/transfer",{method:"POST",body:{email}});alert("Ticket transferred.");location.reload()}catch(e){alert(e.message)}}
</script></body></html>
