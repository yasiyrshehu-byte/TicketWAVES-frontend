<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Tickets</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="header"></div><main class="container"><form class="form-card" id="ticketForm"><h1>Add tickets to event</h1><div class="form-group"><label>Event ID</label><input name="eventId" required placeholder="Mongo event ID"></div><div class="form-group"><label>Ticket label prefix</label><input name="label" value="General Admission"></div><div class="form-group"><label>Section</label><input name="section"></div><div class="form-group"><label>Row</label><input name="row"></div><div class="form-group"><label>Starting seat</label><input name="seatStart" type="number" value="1"></div><div class="form-group"><label>Price</label><input name="price" type="number" step="0.01" required></div><div class="form-group"><label>Currency</label><input name="currency" value="USD"></div><div class="form-group"><label>Number of tickets</label><input name="count" type="number" min="1" value="1"></div><button class="btn">Add tickets</button></form></main><script>fetch('/admin/_head.html').then(r=>r.text()).then(x=>document.querySelector('#header').innerHTML=x);document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#ticketForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.count=Number(d.count);d.price=Number(d.price);try{await TW.api('/events/'+d.eventId+'/tickets',{method:'POST',body:JSON.stringify(d)});alert('Tickets added');location.href='/admin/tickets.html'}catch(x){alert(x.message)}}})</script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
