<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section" style="max-width:850px"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><div class="formcard" style="margin-top:22px"><h1 id="heading">Add Ticket</h1><p class="muted">Admin can add or edit section, row, seat and additional ticket information.</p><div id="msg"></div><form id="f"><div class="formgrid"><div class="field full"><label>Event</label><select id="event" name="event" required></select></div><div class="field"><label>Price</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Currency</label><input name="currency" value="NGN"></div><div class="field"><label>Section</label><input name="section"></div><div class="field"><label>Row</label><input name="row"></div><div class="field"><label>Seat</label><input name="seat"></div><div class="field"><label>Additional sections</label><input name="additionalSections" placeholder="110, 111, VIP"></div><div class="field"><label>Additional rows</label><input name="additionalRows" placeholder="A, B, C"></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1"></div><div class="field"><label>Status</label><select name="status"><option value="available">Available</option><option value="reserved">Reserved</option><option value="sold">Sold</option></select></div><div class="field full"><label>Additional ticket information</label><textarea name="additionalInfo" placeholder="VIP, entrance gate, restrictions, map notes, etc."></textarea></div></div><div class="actions"><button class="primary">Save ticket</button><a class="secondary" href="/admin/tickets.html">Cancel</a></div></form></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let ev=await TW.request("/admin/events");event.innerHTML=ev.events.map(e=>`<option value="${e._id}">${escapeHtml(e.title)} — ${new Date(e.date).toLocaleDateString()}</option>`).join("");let id=new URLSearchParams(location.search).get("id");if(id){heading.textContent="Edit Ticket";let all=await TW.request("/admin/tickets");let t=all.tickets.find(x=>x._id===id);if(t){for(const k of ["event","price","currency","section","row","seat","additionalSections","additionalRows","quantity","status","additionalInfo"]){let el=f.elements[k];if(el)el.value=t[k]??(k==="event"?t.event?._id:"")}}}})();
f.onsubmit=async e=>{e.preventDefault();let id=new URLSearchParams(location.search).get("id");let body={};new FormData(f).forEach((v,k)=>body[k]=v);try{await TW.request(id?"/tickets/"+id:"/tickets",{method:id?"PATCH":"POST",body});msg.innerHTML='<div class="notice success">Ticket saved.</div>';setTimeout(()=>location.href="/admin/tickets.html",700)}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
