<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · TicketWAVES</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">Ticket<span>WAVES</span></a><nav class="navlinks" id="navlinks"></nav></div></header><main class="container"><div class="form-card"><div class="eyebrow">Secure test checkout</div><h1>Review your tickets</h1><div id="checkoutSummary"></div><div class="form-group"><label>Payment</label><input value="Test payment — connect your payment provider before accepting real money" readonly></div><button class="btn" id="payBtn" style="width:100%">Confirm test purchase</button><p class="muted">This development checkout creates the order through the server. A production payment provider must confirm payment server-side before an order is marked paid.</p></div></main><script src="/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!TW.session())return location.href='/login.html?next='+encodeURIComponent(location.href);const p=new URLSearchParams(location.search),eventId=p.get('eventId'),ticketIds=(p.get('ticketIds')||'').split(',').filter(Boolean),box=document.querySelector('#checkoutSummary');try{const {event:e}=await TW.api('/events/'+eventId);const selected=e.tickets.filter(t=>ticketIds.includes(t.ticketId));const subtotal=selected.reduce((s,t)=>s+Number(t.price),0),fees=Math.round(subtotal*.05*100)/100;box.innerHTML=`<h2>${TW.escapeHtml(e.title)}</h2><p class="muted">${TW.escapeHtml(e.date)} · ${TW.escapeHtml(e.time)} · ${TW.escapeHtml(e.venue)}, ${TW.escapeHtml(e.city)}</p>${selected.map(t=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid #eee"><span>${TW.escapeHtml(t.label)}</span><strong>${TW.money(t.price,t.currency)}</strong></div>`).join('')}<div class="row between" style="margin-top:12px"><span>Subtotal</span><strong>${TW.money(subtotal)}</strong></div><div class="row between"><span>Service fee</span><strong>${TW.money(fees)}</strong></div><div class="row between" style="margin-top:10px;font-size:18px"><strong>Total</strong><strong>${TW.money(subtotal+fees)}</strong></div>`;document.querySelector('#payBtn').onclick=async()=>{try{const {order}=await TW.api('/orders',{method:'POST',body:JSON.stringify({eventId,ticketIds})});location.href='/ticket.html?id='+order._id}catch(err){alert(err.message)}}}catch(e){box.innerHTML='<div class="alert">'+TW.escapeHtml(e.message)+'</div>';document.querySelector('#payBtn').disabled=true}})</script></body></html>
