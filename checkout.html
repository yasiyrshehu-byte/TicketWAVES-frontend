<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a></nav></header><main class="wrap section"><div class="panel" style="max-width:700px;margin:auto"><h1>Secure checkout</h1><p style="color:var(--muted)">Your seats are reserved only when payment initialization succeeds.</p><div id="summary"></div><button id="pay" class="primary" style="width:100%;margin-top:20px">Pay with Paystack</button><p id="msg"></p></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>if(!requireLogin()){}const c=JSON.parse(sessionStorage.getItem('tw_checkout')||'null');if(!c)location.href='events.html';summary.textContent='Loading selected seats…';api('/api/events/'+c.eventId+'/seats').then(d=>{const s=d.seats.filter(x=>c.seatIds.includes(x.id));summary.innerHTML=s.map(x=>`<div class="pill" style="margin:5px">Section ${esc(x.section)} · Row ${esc(x.row_name)} · Seat ${esc(x.seat)} · ${money(x.price,x.currency)}</div>`).join('');pay.onclick=async()=>{pay.disabled=true;msg.textContent='Opening secure payment…';try{const r=await api('/api/payment/initialize',{method:'POST',body:JSON.stringify({eventId:c.eventId,seatIds:c.seatIds})});sessionStorage.removeItem('tw_checkout');location.href=r.authorization_url}catch(e){msg.textContent=e.message;pay.disabled=false}}}).catch(e=>summary.textContent=e.message);</script></body></html>
