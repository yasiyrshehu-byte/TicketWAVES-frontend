<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap section"><div class="panel" style="max-width:600px;margin:auto"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><h1>Your profile</h1><form id="f" class="form"><div class="row"><input class="field" name="firstName"><input class="field" name="lastName"></div><input class="field" name="phone"><input class="field" name="email" disabled><button class="primary">Save changes</button></form><p id="m"></p><button class="secondary" onclick="location.href='tickets.html'">My Tickets</button> <button class="danger" onclick="logout()">Logout</button></div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>if(requireLogin())api('/api/users/me').then(d=>{for(const [k,v] of Object.entries({firstName:d.user.firstName,lastName:d.user.lastName,phone:d.user.phone,email:d.user.email}))f[k].value=v});f.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/users/me',{method:'PATCH',body:JSON.stringify({firstName:f.firstName.value,lastName:f.lastName.value,phone:f.phone.value})});localStorage.tw_user=JSON.stringify(r.user);m.textContent='Saved.'}catch(e){m.textContent=e.message}}</script></body></html>
