<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tickets · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><div class="links"><a href="events.html">Events</a><a href="orders.html">Orders</a><a href="profile.html">Profile</a><a href="#" onclick="logout();return false">Logout</a></div></nav></header><main class="wrap section"><h1>My Tickets</h1><div id="grid" class="grid"></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>if(requireLogin())api('/api/tickets/me').then(d=>{grid.innerHTML=d.tickets.map(t=>`<a class="ticket" href="ticket.html?id=${t.id}"><img class="event-img" src="${img(t.eventImage)}"><div class="ticket-body"><span class="status">${esc(t.status)}</span><h2>${esc(t.eventTitle)}</h2><div class="meta" style="color:#cbd2e6"><span>📅 ${esc(t.date)} · ${esc(t.time||'')}</span><span>📍 ${esc(t.venue)}, ${esc(t.city)}</span><span>Section ${esc(t.section||'—')} · Row ${esc(t.row||'—')} · Seat ${esc(t.seat||'—')}</span><span>Ticket ${esc(t.ticketNumber)}</span></div></div></a>`).join('')||'<div class="empty">No tickets yet. Buy an event or ask an admin to issue a giveaway ticket.</div>'}).catch(e=>grid.innerHTML='<div class="empty">'+esc(e.message)+'</div>');</script></body></html>
