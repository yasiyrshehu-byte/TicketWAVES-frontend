<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Event | TicketWAVES</title><link rel="stylesheet" href="css/admin.css"></head><body><header class="admin-nav"><b>TICKETWAVES ADMIN</b><a href="admin-events.html">Events</a></header><main class="admin"><div class="admin-card"><h1>Add event</h1><form id="eventForm"><input id="title" placeholder="Event title" required><input id="artist" placeholder="Artist" required><textarea id="description" placeholder="Description" required></textarea><input id="category" placeholder="Category" required><input id="venue" placeholder="Venue" required><div class="two"><input id="city" placeholder="City" required><input id="country" placeholder="Country" required></div><div class="two"><input id="date" type="date" required><input id="time" type="time" required></div><div class="two"><input id="currency" value="NGN" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required></div><input id="totalTickets" type="number" min="1" placeholder="Total tickets" required><input id="image" placeholder="Event image URL"><button>Publish event</button><p id="message"></p></form></div></main><script src="config.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
