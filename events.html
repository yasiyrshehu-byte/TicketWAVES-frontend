<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><div class="links"><a href="index.html">Home</a><a href="events.html">Events</a><a data-auth href="orders.html">My Orders</a><a data-auth href="tickets.html">My Tickets</a><a data-guest href="login.html">Login</a><a data-auth href="#" onclick="logout();return false">Logout</a></div></nav></header><main class="wrap section"><h1>Find your next night out.</h1><p style="color:var(--muted)">Browse live events from around the world.</p><div class="filters"><input id="q" class="field" placeholder="Search events, artists, venues or cities"><select id="country" class="field"><option value="">All countries</option></select><select id="sort" class="field"><option value="date">Soonest</option><option value="price">Price</option></select></div><div id="grid" class="grid"></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>let all=[];const qs=new URLSearchParams(location.search);q.value=qs.get('q')||'';function render(){let a=all.filter(e=>{const x=(e.title+' '+e.artist+' '+e.venue+' '+e.city+' '+e.country).toLowerCase();return !q.value||x.includes(q.value.toLowerCase())}).filter(e=>!country.value||e.country===country.value);if(sort.value==='price')a.sort((x,y)=>Number(x.minPrice||0)-Number(y.minPrice||0));grid.innerHTML=a.map(e=>`<a class="card" href="event.html?id=${e.id}"><img class="event-img" src="${img(e.image)}"><div class="pad"><div class="eyebrow">${esc(e.artist||'Live Event')}</div><div class="title">${esc(e.title)}</div><div class="meta"><span>📅 ${esc(e.date)} · ${esc(e.time)}</span><span>📍 ${esc(e.venue)}, ${esc(e.city)}</span><span>🎟 ${e.availableSeats} available</span></div></div></a>`).join('')||'<div class="empty">No events match your search.</div>'}api('/api/events').then(d=>{all=d.events;[...new Set(all.map(x=>x.country).filter(Boolean))].sort().forEach(c=>country.insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));render()}).catch(e=>grid.innerHTML='<div class="empty">'+esc(e.message)+'</div>');q.oninput=render;country.onchange=render;sort.onchange=render;</script></body></html>
