<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events — TicketWAVES Admin</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap section"><a class="logo" href="/admin/index.html">TICKET<span>WAVES</span> ADMIN</a><div class="sectionhead"><h1>Events</h1><a class="primary" href="/admin/create-event.html">Create Event</a></div><div id="out" class="grid"></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script>
(async()=>{let u=await requireUser();if(!u||u.role!=="admin")return;let d=await TW.request("/admin/events");out.innerHTML=d.events.length?d.events.map(e=>`<div class="card"><div class="cardbody"><span class="tag">${e.active?"Active":"Archived"}</span><div class="eventtitle">${escapeHtml(e.title)}</div><p class="muted">${escapeHtml(e.venue)} · ${new Date(e.date).toLocaleDateString()}</p><div class="actions"><a class="secondary" href="/admin/create-event.html?id=${e._id}">Edit</a><button class="secondary" onclick="del('${e._id}')">Archive</button></div></div></div>`).join(""):'<div class="empty">No events.</div>'})();async function del(id){if(confirm("Archive event?")){await TW.request("/events/"+id,{method:"DELETE"});location.reload()}}
</script></body></html>
