<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175cff"><title>Create account | TicketWAVES</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="auth"><div class="auth-card"><a class="brand" href="./index.html">TICKET<span>WAVES</span></a><h1>Create your account</h1><p class="small">If you're accepting a transferred ticket, use the recipient email from the invitation.</p><form id="form"><div class="two"><div class="field"><label>First name</label><input id="firstName" required autocomplete="given-name"></div><div class="field"><label>Last name</label><input id="lastName" required autocomplete="family-name"></div></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Phone</label><input id="phone" autocomplete="tel"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="primary" type="submit">Create account</button><p id="msg"></p></form><p class="small">Already have an account? <a href="./login.html">Sign in</a></p></div></main><footer>© 2026 TicketWAVES · <a href="./support.html">Customer support</a></footer><script src="./config.js"></script><script src="./js/app.js"></script><script src="./js/auth.js"></script></body></html>
