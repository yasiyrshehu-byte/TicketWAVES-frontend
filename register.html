<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap section"><div class="panel" style="max-width:560px;margin:60px auto"><a class="logo" href="index.html">TICKET<span>WAVES</span></a><h1>Create your account.</h1><form id="f" class="form"><div class="row"><input class="field" name="firstName" placeholder="First name" required><input class="field" name="lastName" placeholder="Last name" required></div><input class="field" name="email" type="email" placeholder="Email" required><input class="field" name="phone" placeholder="Phone"><input class="field" name="password" type="password" placeholder="Password (8+ characters)" required><button class="primary">Create account</button></form><p id="m"></p><p>Already registered? <a style="color:var(--blue)" href="login.html">Sign in</a></p></div></main><button class="api-setting" onclick="saveApi()">API Settings</button><script src="js/config.js"></script><script src="js/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});localStorage.tw_token=r.token;localStorage.tw_user=JSON.stringify(r.user);location.href='index.html'}catch(e){m.textContent=e.message}}</script></body></html>
