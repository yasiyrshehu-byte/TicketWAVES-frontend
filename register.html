<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — TicketWAVES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="wrap" style="padding:70px 0;max-width:560px"><a class="logo" href="/index.html">TICKET<span>WAVES</span></a><section class="section"><div class="formcard"><h1>Create your account</h1><p class="muted">Your account and tickets are stored in MongoDB through the backend.</p><div id="msg"></div><form id="f"><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="actions"><button class="primary">Create account</button><a class="secondary" href="/pages/login.html">Sign in</a></div></form></div></section></main><script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script>
f.onsubmit=async e=>{e.preventDefault();try{let d=await TW.request("/auth/register",{method:"POST",body:{name:name.value,email:email.value,password:password.value}});localStorage.setItem("tw_token",d.token);location.href="/index.html"}catch(x){msg.innerHTML=`<div class="notice danger">${x.message}</div>`}}
</script></body></html>
