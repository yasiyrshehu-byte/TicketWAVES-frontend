<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment · TicketWAVES</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap section"><div class="panel" style="max-width:650px;margin:80px auto;text-align:center"><h1>Checking your payment…</h1><p id="msg">Please wait.</p><a class="primary" href="tickets.html">Open My Tickets</a></div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>const ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref');if(!ref){msg.textContent='Payment reference not found.'}else api('/api/payment/verify/'+encodeURIComponent(ref)).then(d=>msg.textContent=d.success?'Payment confirmed. Your ticket is ready in My Tickets.':(d.order?.status||'Payment not confirmed yet.')).catch(e=>msg.textContent=e.message);</script></body></html>
