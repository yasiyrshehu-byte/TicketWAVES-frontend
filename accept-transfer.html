<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Ticket — TicketWAVES</title><style>body{font-family:Arial;background:#f4f5f7;margin:0}.box{max-width:600px;margin:60px auto;background:#fff;padding:28px;border-radius:20px}button{padding:13px 18px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:800}</style></head><body><div class="box" id="app">Loading transfer…</div><script>
const API="https://ticketwaves-backend-3.onrender.com/api";const token=localStorage.getItem("ticketwaves_token");const t=new URLSearchParams(location.search).get("token");function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function run(){try{const r=await fetch(API+"/transfers/invitation/"+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw new Error(d.message||"Invalid invitation");document.getElementById("app").innerHTML=`<h1>🎟️ Ticket waiting for you</h1><p>${esc(d.fromName)} sent you a ticket for <b>${esc(d.ticket?.eventId?.title||"an event")}</b>.</p><p>Recipient: ${esc(d.recipientEmail)}</p>${token?'<button onclick="accept()">Accept Ticket</button>':'<button onclick="location.href=\\'./index.html?register=1\\'">Create / Sign in to TicketWAVES</button>'}`;}catch(e){document.getElementById("app").innerHTML="<h1>Transfer unavailable</h1><p>"+esc(e.message)+"</p>";}}
async function accept(){try{const r=await fetch(API+"/transfers/accept",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({token:t})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Could not accept");alert("Ticket accepted!");location.href="./index.html";}catch(e){alert(e.message);}}run();
</script></body></html>
