<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Accept Ticket | TicketWAVES</title>
<style>
:root{--blue:#1765f5;--ink:#11182b;--muted:#707887;--bg:#f4f5f7;--line:#e1e4ea;--red:#e44852}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.top{background:#090b10;color:#fff;padding:22px;text-align:center;font-size:29px;font-weight:950;letter-spacing:-1px}.top span{color:#4d8dff}
.wrap{max-width:680px;margin:auto;padding:24px 18px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 35px #11182b12}.card img{width:100%;height:280px;object-fit:cover;display:block}.body{padding:24px}.body h1{font-size:29px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.seat{background:#f5f7fa;border-radius:12px;padding:14px}.seat small{display:block;color:#778091;font-weight:800}.seat b{font-size:19px}.btn{display:block;width:100%;border:0;border-radius:13px;padding:16px;margin-top:12px;font-weight:950;font-size:16px;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf0ff;color:#2050c7}.danger{background:var(--red);color:#fff}.note{background:#f4f7ff;border-radius:13px;padding:14px;color:#556176;margin:16px 0}.loading{text-align:center;padding:50px}.error{color:var(--red);font-weight:800}
@media(max-width:600px){.wrap{padding:15px 12px 40px}.card img{height:245px}.body{padding:20px}.body h1{font-size:26px}.seats{gap:6px}.seat{padding:11px}.seat b{font-size:17px}}
</style>
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body>
<div class="top">TICKET<span>WAVES</span></div>
<main class="wrap"><div id="app" class="card"><div class="loading">Checking your ticket transfer…</div></div></main>
<script src="./config.js"></script><script>
const API=(window.TICKETWAVES_API||'https://ticketwaves-backend-3.onrender.com/api').replace(/\/$/,'');
const token=new URLSearchParams(location.search).get('token');
let transfer=null;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function frontend(){return (location.origin+location.pathname).replace(/\/accept-transfer\.html$/,'/index.html')}
function imageUrl(e){if(!e)return '';if(e.image&&/^https?:/i.test(e.image))return e.image;if(e._id)return API+'/events/'+encodeURIComponent(e._id)+'/image';return ''}
function showError(message){document.getElementById('app').innerHTML='<div class="body"><h1>Transfer unavailable</h1><p class="error">'+esc(message)+'</p></div>'}
async function load(){
 try{
  if(!token)throw new Error('This transfer link is missing.');
  const r=await fetch(API+'/transfers/token/'+encodeURIComponent(token));
  const d=await r.json();if(!r.ok)throw new Error(d.message||'Transfer not found.');
  transfer=d;
  if(d.status!=='pending'){
   document.getElementById('app').innerHTML='<div class="body"><h1>Transfer '+esc(d.status)+'</h1><p class="muted">This ticket transfer is no longer available.</p></div>';return;
  }
  const t=d.ticket||{},e=t.eventId||{},img=imageUrl(e);
  document.getElementById('app').innerHTML=(img?'<img src="'+esc(img)+'" alt="'+esc(e.title||'Event')+'">':'')+'<div class="body"><h1>You\'ve Received a Ticket</h1><p class="muted"><b>'+esc(d.fromName||'A TicketWAVES user')+'</b> sent you a ticket for <b>'+esc(e.title||'this event')+'</b>.</p><p class="muted">This invitation was sent to <b>'+esc(d.recipientEmail||d.recipientPhone||'you')+'</b>.</p><p class="muted">'+esc(e.date||'')+(e.time?' · '+esc(e.time):'')+'<br>'+esc(e.venue||'')+(e.city?', '+esc(e.city):'')+'</p><div class="seats"><div class="seat"><small>SECTION</small><b>'+esc(t.section||'-')+'</b></div><div class="seat"><small>ROW</small><b>'+esc(t.row||'-')+'</b></div><div class="seat"><small>SEAT</small><b>'+esc(t.seat||'-')+'</b></div></div>'+(d.note?'<div class="note"><b>Note from sender</b><br>'+esc(d.note)+'</div>':'')+'<div class="note"><b>Important</b><br>You must create or sign in to a TicketWAVES account using the recipient email before the ticket can be viewed or accepted.</div><button class="btn primary" onclick="continueTransfer()">CONTINUE & ACCEPT TICKET</button><button class="btn danger" onclick="decline()">DECLINE TRANSFER</button></div>';
 }catch(e){showError(e.message||'Unable to load this transfer.')}
}
function continueTransfer(){const logged=Boolean(localStorage.getItem('ticketwaves_token')||localStorage.getItem('token'));if(logged){location.href=frontend()+'?transfer='+encodeURIComponent(token)}else{location.href=frontend()+'?transfer='+encodeURIComponent(token)+'&email='+encodeURIComponent(transfer?.recipientEmail||'')}}
function createAccount(){continueTransfer()}
function signIn(){location.href=frontend()+'?transfer='+encodeURIComponent(token)+'&email='+encodeURIComponent(transfer?.recipientEmail||'')+'&login=1'}
async function decline(){if(!confirm('Decline this ticket transfer?'))return;alert('Please sign in first to decline a transfer securely.');signIn()}
load();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script></body>
</html>
