<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Ticket — TicketWAVES</title><style>body{font-family:Arial;background:#f4f5f7;margin:0}.box{max-width:600px;margin:60px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}button{padding:13px 18px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:800;margin-top:12px;width:100%}.muted{color:#666}</style></head><body><div class="box" id="app">Loading transfer…</div><script>
const API="https://ticketwaves-backend-3.onrender.com/api";const token=localStorage.getItem("ticketwaves_token")||localStorage.getItem("token");const transferToken=new URLSearchParams(location.search).get("token");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function run(){try{if(!transferToken)throw new Error("Transfer link is missing.");const r=await fetch(API+"/transfers/invitation/"+encodeURIComponent(transferToken));const d=await r.json();if(!r.ok)throw new Error(d.message||"Invalid invitation");document.getElementById("app").innerHTML=`<h1>🎟️ Ticket waiting for you</h1><p>${esc(d.fromName)} sent you a ticket for <b>${esc(d.ticket?.eventId?.title||"an event")}</b>.</p><p>Recipient: ${esc(d.recipientEmail)}</p><p class="muted">If you don't have an account, create one below. The transfer will be preserved.</p><div id="action"></div>`;const action=document.getElementById("action");if(token){action.innerHTML='<button id="acceptBtn">Accept Ticket</button>';document.getElementById("acceptBtn").onclick=accept;}else{action.innerHTML='<button id="accountBtn">Create Account / Sign In</button>';document.getElementById("accountBtn").onclick=()=>location.href="./index.html?register=1&transfer="+encodeURIComponent(transferToken);}}catch(e){document.getElementById("app").innerHTML="<h1>Transfer unavailable</h1><p>"+esc(e.message)+"</p>";}}
async function accept(){try{const r=await fetch(API+"/transfers/accept",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({token:transferToken})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Could not accept");alert("Ticket accepted! It is now in your My Tickets.");location.href="./index.html";}catch(e){alert(e.message);}}run();
</script></body></html>
