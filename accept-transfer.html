<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Accept Ticket — TicketWAVES</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f7;color:#11182b}.top{background:#090b10;color:#fff;padding:24px 20px}.wrap{max-width:620px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #e1e4ea;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #11182b10}.hero{background:linear-gradient(135deg,#0b1022,#172c65);color:#fff;padding:28px}.hero h1{margin:10px 0 5px}.content{padding:24px}.meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #e1e4ea;border-bottom:1px solid #e1e4ea;margin:18px 0}.meta div{padding:15px 7px}.meta small{display:block;color:#707887;font-weight:900;font-size:10px}.meta strong{font-size:20px}button{width:100%;border:0;border-radius:13px;padding:15px;background:#1765f5;color:#fff;font-weight:900;font-size:16px;margin-top:10px}.secondary{background:#eaf0ff;color:#2050c7}.spinner{display:inline-block;width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-5px;margin-right:8px}@keyframes r{to{transform:rotate(360deg)}}.muted{color:#707887}@media(max-width:500px){.meta strong{font-size:17px}}</style></head><body><div class="top"><b>TicketWAVES</b></div><div class="wrap"><div class="box" id="box"><div class="hero"><span>SECURE TICKET TRANSFER</span><h1>Loading transfer…</h1></div><div class="content"><p><span class="spinner"></span>Checking your ticket transfer.</p></div></div></div><script>const API='https://ticketwaves-backend-3.onrender.com/api',t=new URLSearchParams(location.search).get('token');const box=document.getElementById('box');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function run(){if(!t){box.innerHTML='<div class="content"><h2>Transfer link is missing.</h2></div>';return}try{const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');const e=d.ticket?.eventId||{},tk=d.ticket||{};box.innerHTML='<div class="hero"><span>SECURE TICKET TRANSFER</span><h1>Ticket waiting for you</h1><p>'+esc(d.fromName||'A TicketWAVES user')+' sent this ticket to '+esc(d.recipientEmail)+'</p></div><div class="content"><h2>'+esc(e.title||'Event ticket')+'</h2><p class="muted">'+esc(e.artist||'')+' · '+esc(e.date||'')+' · '+esc(e.time||'')+' · '+esc(e.venue||'')+'</p><div class="meta"><div><small>SECTION</small><strong>'+esc(tk.section||'-')+'</strong></div><div><small>ROW</small><strong>'+esc(tk.row||'-')+'</strong></div><div><small>SEAT</small><strong>'+esc(tk.seat||'-')+'</strong></div></div><p class="muted">First create or sign in to the TicketWAVES account using <b>'+esc(d.recipientEmail)+'</b>. The ticket will not be displayed until the transfer is accepted.</p><button onclick="location.href='./index.html?transfer='+encodeURIComponent(t)+'&signup=1'">Create account to accept</button><button class="secondary" onclick="location.href='./index.html?transfer='+encodeURIComponent(t)+''">I already have an account</button></div>'}catch(e){box.innerHTML='<div class="content"><h2>Unable to load transfer</h2><p class="muted">'+esc(e.message)+'</p><button onclick="run()">Try again</button></div>'}}run();</script></body></html>
