<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TicketWAVES Transfer</title><style>body{font-family:Arial;background:#f4f5f7;padding:30px}.box{max-width:560px;margin:50px auto;background:#fff;padding:30px;border-radius:22px;text-align:center}button{background:#1765f5;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-weight:800}</style></head><body><div class="box"><h1>TicketWAVES</h1><div id="x">Loading transfer...</div></div><script>const API='https://ticketwaves-backend-3.onrender.com/api',t=new URLSearchParams(location.search).get('token');async function run(){try{const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.message);document.getElementById('x').innerHTML=`<h2>Ticket transfer request</h2><p>${d.fromName||'A TicketWAVES user'} sent you a ticket.</p><p><b>${d.ticket?.eventId?.title||'Event ticket'}</b></p><p>${d.recipientEmail}</p><button onclick="accept()">Sign in to accept</button>`}catch(e){document.getElementById('x').textContent=e.message}}async function accept(){location.href='./index.html?transfer='+encodeURIComponent(t)}run();</script></body></html>
