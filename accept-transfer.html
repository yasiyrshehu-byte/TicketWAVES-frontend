<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>TicketWAVES — Transfer</title><style>body{margin:0;background:#f4f5f7;color:#11182b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(90%,560px);background:#fff;padding:30px;border-radius:24px;text-align:center;box-shadow:0 15px 45px #11182b14}.spinner{width:36px;height:36px;border:4px solid #1765f5;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:15px auto}@keyframes spin{to{transform:rotate(360deg)}}button{background:#1765f5;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-weight:900}</style></head><body><div class="box"><h1>TicketWAVES</h1><div id="x"><span class="spinner"></span><p>Loading transfer…</p></div></div><script>const API='https://ticketwaves-backend-3.onrender.com/api',t=new URLSearchParams(location.search).get('token');async function run(){try{if(!t)throw Error('Transfer link is missing.');const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.message);if(d.status!=='pending'){document.getElementById('x').innerHTML=`<h2>Transfer ${d.status}</h2><p>This transfer is no longer pending.</p>`;return}document.getElementById('x').innerHTML=`<h2>Ticket transfer request</h2><p>${d.fromName||'A TicketWAVES user'} sent you a ticket.</p><p><b>${d.ticket?.eventId?.title||'Event ticket'}</b></p><p>${d.recipientEmail}</p><button onclick="accept()">Sign in to accept</button>`}catch(e){document.getElementById('x').innerHTML='<h2>Transfer unavailable</h2><p>'+e.message+'</p>'}}function accept(){location.href='./index.html?transfer='+encodeURIComponent(t)}run();</script></body></html>
