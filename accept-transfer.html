<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Ticket — TicketWAVES</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f4f5f7}.card{max-width:560px;margin:60px auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 30px #0001}button{width:100%;padding:14px;border:0;border-radius:12px;background:#155eef;color:#fff;font-weight:800;margin-top:10px}a{color:#155eef}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-top:8px}</style></head><body><main class="card"><h1>TICKETWAVES</h1><div id="app">Loading transfer…</div></main><script>
const API="https://ticketwaves-backend-3.onrender.com/api";const p=new URLSearchParams(location.search);const transfer=p.get("token")||p.get("transfer");const token=localStorage.getItem("token")||localStorage.getItem("ticketwaves_token");const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){if(!transfer){document.getElementById("app").innerHTML="Invalid transfer link.";return}try{const r=await fetch(API+"/transfers/invitation/"+encodeURIComponent(transfer));const d=await r.json();if(!r.ok)throw new Error(d.message||"Transfer not found");const e=d.ticket?.eventId||{};if(token){document.getElementById("app").innerHTML=`<h2>You've received a ticket</h2><p><b>${esc(e.title||"Event")}</b></p><p>This invitation was sent to <b>${esc(d.recipientEmail)}</b>.</p><button onclick="accept()">Accept Ticket</button>`}else{localStorage.setItem("ticketwaves_transfer_token",transfer);document.getElementById("app").innerHTML=`<h2>You've received a ticket</h2><p><b>${esc(e.title||"Event")}</b></p><p>This ticket was sent to <b>${esc(d.recipientEmail)}</b>.</p><p>Create or sign in to a TicketWAVES account using that email, then accept the ticket.</p><button onclick="location.href='register.html?transfer=1&email=${encodeURIComponent(d.recipientEmail)}'">Create Account</button><button onclick="location.href='login.html?transfer=1&email=${encodeURIComponent(d.recipientEmail)}'">Sign In</button>`}}catch(e){document.getElementById("app").innerHTML=`<p>${esc(e.message)}</p>`}}
async function accept(){try{const r=await fetch(API+"/transfers/accept",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({token:transfer})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Could not accept transfer");localStorage.removeItem("ticketwaves_transfer_token");location.href="ticket.html?ticket="+encodeURIComponent(d.ticket._id||d.ticket.id)}catch(e){alert(e.message)}}load();
</script></body></html>
