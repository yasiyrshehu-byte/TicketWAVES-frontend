<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10162f">
  <title>TicketWAVES Admin</title>
  <link rel="stylesheet" href="./assets/css/app.css">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body class="admin-body">
  <div id="toast" class="toast" aria-live="polite"></div>
  <header class="admin-header">
    <a class="brand" href="./index.html#discover"><span>TICKET</span><b>WAVES</b></a>
    <div class="admin-title"><span>ADMIN</span><small id="admin-email">Control centre</small></div>
    <button id="admin-logout" class="ghost-btn">Logout</button>
  </header>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="#dashboard" data-admin-nav>Overview</a>
      <a href="#users" data-admin-nav>Users</a>
      <a href="#suspendedUsers" data-admin-nav>Suspended users</a>
      <a href="#events" data-admin-nav>Events</a>
      <a href="#tickets" data-admin-nav>All tickets</a>
      <a href="#availableTickets" data-admin-nav>Available tickets</a>
      <a href="#orders" data-admin-nav>All orders</a>
      <a href="#paidOrders" data-admin-nav>Paid orders</a>
      <a href="#revenue" data-admin-nav>Revenue</a>
      <a href="#giveaways" data-admin-nav>Giveaways</a>
      <a href="#create-event" data-admin-nav>Create event</a>
      <a href="#create-giveaway" data-admin-nav>Create giveaway</a>
      <a href="#support" data-admin-nav>Support</a>
    </aside>
    <main id="admin-app" class="admin-main">
      <section data-page="dashboard" class="admin-page"></section>
      <section data-page="users" class="admin-page"></section>
      <section data-page="suspendedUsers" class="admin-page"></section>
      <section data-page="events" class="admin-page"></section>
      <section data-page="tickets" class="admin-page"></section>
      <section data-page="availableTickets" class="admin-page"></section>
      <section data-page="orders" class="admin-page"></section>
      <section data-page="paidOrders" class="admin-page"></section>
      <section data-page="revenue" class="admin-page"></section>
      <section data-page="giveaways" class="admin-page"></section>
      <section data-page="create-event" class="admin-page"></section>
      <section data-page="create-giveaway" class="admin-page"></section>
      <section data-page="support" class="admin-page"></section>
    </main>
  </div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/admin.js"></script>
</body>
</html>
