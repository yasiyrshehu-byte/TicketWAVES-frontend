<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175cff"><title>Admin | TicketWAVES</title><link rel="stylesheet" href="./css/admin.css"></head><body><header class="admin-nav"><b>TICKETWAVES ADMIN</b><nav><a href="#create">Create event</a><a href="#events">Events</a><a href="#tickets">Free ticket</a><a href="#support">Support</a><button onclick="logout()">Logout</button></nav></header><main id="adminDashboard" class="admin-main"><div id="stats" class="stats"></div><p id="adminMsg"></p><section id="create" class="admin-card"><h2>Create event + seats</h2><form id="eventForm" class="admin-form"><input id="title" placeholder="Event title" required><input id="artist" placeholder="Artist"><input id="venue" placeholder="Venue" required><div class="two"><input id="city" placeholder="City" required><input id="country" placeholder="Country" required></div><div class="two"><input id="date" type="date" required><input id="time" type="time" required></div><div class="two"><input id="currency" value="NGN" required><input id="price" type="number" min="0" step="0.01" placeholder="Price per seat" required></div><input id="image" placeholder="Licensed event image URL"><textarea id="description" placeholder="Description" required></textarea><input id="sections" value="A" placeholder="Sections, comma separated" required><div class="two"><input id="rows" type="number" min="1" value="5" placeholder="Rows per section" required><input id="seatsPerRow" type="number" min="1" value="10" placeholder="Seats per row" required></div><button type="submit">Create event</button><p id="eventMsg"></p></form></section><section id="events" class="admin-card"><h2>Events</h2><div id="eventList">Loading…</div></section><section id="tickets" class="admin-card"><h2>Issue free ticket</h2><p class="small">The recipient must already have a TicketWAVES account.</p><form id="freeForm" class="admin-form"><input id="freeEmail" type="email" placeholder="Recipient account email" required><select id="freeTicket" required><option>Loading available seats…</option></select><button type="submit">Issue free ticket</button><p id="freeMsg"></p></form></section><section id="support" class="admin-card"><h2>Customer support</h2><div id="supportList">Loading…</div></section></main><footer>© 2026 TicketWAVES · <a href="./support.html">Customer support</a></footer><script src="./config.js"></script><script src="./js/app.js"></script><script src="./js/admin.js"></script></body></html>
